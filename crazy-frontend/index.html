<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<title>VoiceBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --palm:#0E3B2E; --palm-2:#17543F; --tomato:#F0462B; --citron:#D7F25A; --mist:#F1F5EC; --sheet:#FFFFFF;
  --text:#12241D; --soft:#5C6B64; --line:#DCE4D8; --ok:#1B8A4B;
  --font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; font-family:var(--font); color:var(--text); background:var(--mist); line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1F6FEB; outline-offset:3px}
[hidden]{display:none !important}
h1,h2,h3,p{margin:0}

.wrap{max-width:1120px; margin:0 auto; padding:0 16px}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 10px}
.brand{display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px}
.brand .name{display:flex; align-items:center; gap:9px; font-weight:700; font-size:1.2rem; letter-spacing:-.01em}
.by{display:flex; align-items:center; gap:7px; color:var(--soft); font-size:.8rem}
.by img{height:24px; width:auto; display:block}
.mark{width:22px; height:22px; border-radius:50%; background:var(--tomato);
  -webkit-mask:radial-gradient(circle 7px at 88% 12%,#0000 97%,#000); mask:radial-gradient(circle 7px at 88% 12%,#0000 97%,#000)}
.lang{border:1.5px solid var(--palm); background:transparent; border-radius:999px; padding:7px 14px; font-weight:500}
.store{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding-bottom:12px; color:var(--soft); font-size:.95rem}
.store b{color:var(--text); font-weight:600}
.open{color:var(--ok); font-weight:500}
.open::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-inline-end:6px}

/* ---------- voice hero ---------- */
.hero{background:var(--palm); color:#fff; border-radius:26px; padding:24px 20px; display:grid; gap:18px; grid-template-columns:auto 1fr; align-items:center}
.hero h1{font-size:clamp(1.9rem,7vw,2.9rem); line-height:1.05; font-weight:600; letter-spacing:-.02em; grid-column:1 / -1}
.talk{position:relative; width:108px; height:108px; border:0; background:transparent; border-radius:50%; padding:0; --lvl:0}
.talk::before{content:""; position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--citron); opacity:0;
  transform:scale(calc(1 + var(--lvl) * .35)); transition:transform .08s linear}
.talk.live::before{opacity:.9}
.bite{position:absolute; inset:0; border-radius:50%; background:var(--tomato);
  -webkit-mask:radial-gradient(circle 27px at 86% 13%,#0000 98%,#000); mask:radial-gradient(circle 27px at 86% 13%,#0000 98%,#000)}
.talk svg,.bars{position:absolute; inset:0; margin:auto}
.talk svg{width:40px; height:40px}
.bars{display:none; width:46px; height:44px; align-items:center; justify-content:space-between}
.bars i{width:6px; border-radius:3px; background:#fff; height:8px; transition:height .08s linear}
.talk.live svg{display:none} .talk.live .bars{display:flex}
.say{min-width:0}
.say .lead{font-size:1.05rem; font-weight:500}
.say .state{color:#CFE3D8; font-size:.95rem; margin-top:4px}
.say .state.bad{color:#FFD3C9}
.caps{grid-column:1 / -1; display:grid; gap:8px; margin:0; padding:0; list-style:none}
.caps li{padding:9px 13px; border-radius:14px; font-size:.95rem; max-width:92%}
.caps .assistant{background:var(--palm-2)}
.caps .user{background:var(--citron); color:var(--text); justify-self:end}
.note{grid-column:1 / -1; font-size:.85rem; color:#CFE3D8}

/* ---------- menu ---------- */
.search{margin:18px 0 12px; position:relative}
.search input{width:100%; padding:13px 16px; border:1.5px solid var(--line); border-radius:14px; background:var(--sheet)}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1.5px solid var(--line); background:var(--sheet); border-radius:999px; padding:8px 15px; font-weight:500}
.chip[aria-pressed="true"]{background:var(--palm); border-color:var(--palm); color:#fff}
.items{background:var(--sheet); border-radius:20px; padding:4px 14px; display:grid; grid-template-columns:1fr}
.item{display:grid; grid-template-columns:76px 1fr; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; border-radius:0}
.item:last-child{border-bottom:0}
.item.lit{background:var(--citron); margin:0 -14px; padding-inline:14px; border-radius:16px; border-bottom-color:transparent}
.tile{width:76px; height:76px; border-radius:18px; background:var(--mist); display:grid; place-items:center; font-size:2.3rem; overflow:hidden}
.tile img{width:100%; height:100%; object-fit:cover}
.item h3{font-size:1.02rem; font-weight:600; line-height:1.25}
.item p{font-size:.86rem; color:var(--soft); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.buy{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px}
.price{font-weight:600; font-variant-numeric:tabular-nums}
.pop{font-size:.75rem; font-weight:500; background:var(--citron); border-radius:6px; padding:1px 7px; margin-inline-start:6px}
.item.lit .pop{background:var(--sheet)}
.add{border:0; background:var(--palm); color:#fff; border-radius:999px; padding:8px 18px; font-weight:500}
.none{padding:36px 8px; text-align:center; color:var(--soft)}

/* ---------- order panel ---------- */
.order{background:var(--sheet); border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  position:fixed; inset-inline:0; bottom:0; z-index:30; max-height:86vh; overflow:auto; transform:translateY(105%); transition:transform .25s ease;
  box-shadow:0 -10px 40px rgba(14,59,46,.22)}
.order.show{transform:none}
.order header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
.order h2{font-size:1.25rem; font-weight:600}
.close{border:0; background:var(--mist); border-radius:999px; padding:7px 14px}
.lines{list-style:none; margin:0; padding:0}
.lines li{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:12px 0; border-bottom:1px solid var(--line)}
.lines small{color:var(--soft); grid-column:1 / -1}
.qty{display:inline-flex; align-items:center; gap:10px; margin-top:6px}
.qty button{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--sheet); font-weight:600; line-height:1}
.sum{display:flex; justify-content:space-between; font-size:1.15rem; font-weight:600; margin-top:14px; font-variant-numeric:tabular-nums}
.vat{color:var(--soft); font-size:.86rem; margin-top:2px}
.cta{width:100%; border:0; background:var(--tomato); color:#fff; border-radius:16px; padding:15px; font-weight:600; font-size:1.02rem; margin-top:16px}
.ghost{width:100%; border:1.5px solid var(--palm); background:transparent; border-radius:16px; padding:13px; font-weight:500; margin-top:14px}
.hint{color:var(--soft); padding:18px 0 4px}
.builder{background:var(--mist); border-radius:14px; padding:12px 14px; margin-bottom:6px; font-size:.93rem}
.builder b{display:block; margin-bottom:2px}
.steps{list-style:none; margin:16px 0 0; padding:0; counter-reset:s}
.steps li{position:relative; padding:0 0 22px; padding-inline-start:40px; color:var(--soft); counter-increment:s}
.steps li::before{content:counter(s); position:absolute; inset-inline-start:0; top:-2px; width:26px; height:26px; border-radius:50%;
  border:2px solid var(--line); background:var(--sheet); display:grid; place-items:center; font-size:.8rem; font-weight:600}
.steps li::after{content:""; position:absolute; inset-inline-start:12px; top:28px; bottom:2px; width:2px; background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done{color:var(--text)} .steps li.done::before{background:var(--ok); border-color:var(--ok); color:#fff}
.steps li.now{color:var(--text); font-weight:600} .steps li.now::before{background:var(--citron); border-color:var(--palm); color:var(--text)}
.bigno{font-size:2.2rem; font-weight:700; letter-spacing:-.02em; line-height:1.1; margin-top:2px}
.tag{display:inline-block; background:var(--citron); border-radius:8px; padding:3px 9px; font-size:.82rem; margin-top:8px}

.bar{position:fixed; inset-inline:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:20; border:0; background:var(--palm); color:#fff;
  border-radius:18px; padding:15px 18px; display:flex; justify-content:space-between; align-items:center; font-weight:500; box-shadow:0 8px 24px rgba(14,59,46,.3)}
.bar b{font-weight:600; font-variant-numeric:tabular-nums}
.shade{position:fixed; inset:0; background:rgba(14,59,46,.45); z-index:25}
.toast{position:fixed; inset-inline:16px; top:14px; z-index:40; background:var(--text); color:#fff; border-radius:14px; padding:12px 16px; max-width:460px; margin-inline:auto}

@media (min-width:960px){
  body{padding-bottom:40px}
  .layout{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:26px; align-items:start}
  .hero{padding:32px; grid-template-columns:auto 1fr; column-gap:26px}
  .talk{width:128px; height:128px}
  .items{grid-template-columns:1fr 1fr; column-gap:28px}
  .item:nth-last-child(2):nth-child(odd){border-bottom:0}
  .order{position:sticky; top:16px; inset-inline:auto; transform:none; border-radius:22px; box-shadow:none; max-height:calc(100vh - 32px); z-index:1}
  .bar,.shade,.close{display:none !important}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>

  try { proc && proc.disconnect(); } catch (e) {} proc = null;
  micStream && micStream.getTracks().forEach(tr => tr.stop()); micStream = null;
  try { ctx && ctx.close(); } catch (e) {} ctx = null; micAn = outAn = null;
  $("talk").classList.remove("live"); $("talk").style.setProperty("--lvl", 0); renderChrome(); setState(key || "idle", bad); renderOrder();
}
$("talk").onclick = startCall;

/* voice level: the ring and bars move with whoever is speaking */
const tmp = new Uint8Array(512), bars = [...document.querySelectorAll(".bars i")], calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function level(an) { if (!an) return 0; an.getByteTimeDomainData(tmp); let s = 0; for (let i = 0; i < tmp.length; i++) { const v = (tmp[i] - 128) / 128; s += v * v; } return Math.min(1, Math.sqrt(s / tmp.length) * 4); }
let smooth = 0;
(function tick(now) {
  if (live && !calm) { smooth += (Math.max(level(micAn), level(outAn)) - smooth) * 0.35; $("talk").style.setProperty("--lvl", smooth.toFixed(3));
    bars.forEach((b, n) => b.style.height = (8 + smooth * 34 * (0.55 + 0.45 * Math.sin(now / 130 + n * 1.3))).toFixed(0) + "px"); }
  requestAnimationFrame(tick);
})(0);

render();
</script>
