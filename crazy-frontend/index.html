<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VoiceBite">
<meta name="description" content="Order by voice with VoiceBite.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>VoiceBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --palm:#0E3B2E; --palm-2:#185740; --deep:#071E17; --tomato:#F0462B; --citron:#D7F25A; --bg:#F5F8F1; --sheet:#FFFFFF;
  --text:#12241D; --soft:#637169; --line:#E2E8DC; --ok:#1B8A4B;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0; font-family:var(--font); color:var(--text); background:var(--deep); line-height:1.45; overflow:hidden}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1F6FEB; outline-offset:2px}
[hidden]{display:none !important}
h1,h2,h3,p,ul,ol{margin:0; padding:0}
ul,ol{list-style:none}

/* ---------- stage: the app sits in a phone-sized frame; on a laptop the frame is centred ---------- */
.stage{height:100dvh; display:flex; align-items:center; justify-content:center; gap:72px;
  background:radial-gradient(900px 600px at 20% 10%, #12402F 0%, transparent 60%), var(--deep)}
.app{position:relative; width:100%; max-width:480px; height:100dvh; background:var(--bg); overflow:hidden; isolation:isolate}
@media (min-width:560px){ .app{height:min(900px,calc(100dvh - 40px)); border-radius:40px; box-shadow:0 40px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07)} }

.view{position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; padding:calc(18px + var(--top)) 18px calc(118px + var(--bottom)); scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.title{font-size:1.9rem; font-weight:500; letter-spacing:-.03em; line-height:1.1}
.h2{display:flex; justify-content:space-between; align-items:baseline; margin:26px 0 12px}
.h2 h2{font-size:1.08rem; font-weight:600; letter-spacing:-.01em}
.link{border:0; background:none; padding:0; color:var(--palm); font-weight:500; text-decoration:underline; text-underline-offset:3px}

/* ---------- home ---------- */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; flex-direction:column; gap:3px}
.name{display:flex; align-items:center; gap:9px; font-weight:600; font-size:1.25rem; letter-spacing:-.02em}
.mark{width:22px; height:22px; border-radius:50%; background:var(--tomato); flex:none;
  -webkit-mask:radial-gradient(circle 7px at 88% 12%,#0000 97%,#000); mask:radial-gradient(circle 7px at 88% 12%,#0000 97%,#000)}
.by{display:flex; align-items:center; gap:7px; color:var(--soft); font-size:.78rem}
.by img{height:22px; width:auto; display:block}
.pillbtn{border:1px solid var(--line); background:var(--sheet); border-radius:999px; padding:8px 15px; font-weight:500}
.store{display:flex; flex-wrap:wrap; gap:4px 12px; margin:16px 0 14px; color:var(--soft); font-size:.92rem}
.store b{color:var(--text); font-weight:600}
.opennow{color:var(--ok); font-weight:500; white-space:nowrap}
.opennow::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-inline-end:6px; vertical-align:1px}

.hero{position:relative; overflow:hidden; background:var(--palm); color:#fff; border-radius:30px; padding:26px 24px 24px}
.hero::after{content:""; position:absolute; inset-inline-end:-10px; bottom:-10px; width:230px; height:230px; pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 100%, transparent 0 24px, rgba(215,242,90,.2) 24px 25.5px);
  -webkit-mask:radial-gradient(circle at 100% 100%, #000 30%, transparent 72%); mask:radial-gradient(circle at 100% 100%, #000 30%, transparent 72%)}
[dir="rtl"] .hero::after{transform:scaleX(-1)}
.hero h1{font-size:clamp(2.2rem,10vw,2.9rem); font-weight:400; letter-spacing:-.035em; line-height:1.02; max-width:9ch}
.hero p{color:#C9DDD2; margin:12px 0 22px; max-width:26ch}
.startbtn{position:relative; z-index:1; border:0; background:var(--tomato); color:#fff; border-radius:999px; padding:13px 22px 13px 16px; font-weight:500;
  display:inline-flex; align-items:center; gap:10px; transition:transform .2s var(--ease)}
[dir="rtl"] .startbtn{padding:13px 16px 13px 22px}
.startbtn:active{transform:scale(.96)}
.startbtn svg{width:22px; height:22px}
.rise{animation:rise .7s var(--ease) both}
.rise:nth-child(2){animation-delay:.07s} .rise:nth-child(3){animation-delay:.14s}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}

.install{display:flex; align-items:center; gap:12px; background:var(--sheet); border:1px solid var(--line); border-radius:20px; padding:12px 14px; margin-top:14px}
.install img{width:44px; height:44px; border-radius:12px}
.install div{flex:1; min-width:0}
.install b{display:block; font-weight:600; font-size:.95rem}
.install span{color:var(--soft); font-size:.82rem}
.solid{border:0; background:var(--palm); color:#fff; border-radius:999px; padding:9px 16px; font-weight:500; white-space:nowrap}
.x{border:0; background:none; color:var(--soft); padding:6px; font-size:1.1rem; line-height:1}

.rail{display:flex; gap:12px; overflow-x:auto; margin:0 -18px; padding:2px 18px 6px; scroll-snap-type:x proximity; scroll-padding-inline:18px; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:none; width:152px; scroll-snap-align:start}
.pic{border-radius:22px; background:#E9EFE3; display:grid; place-items:center; overflow:hidden; font-size:2.6rem}
.pic img{width:100%; height:100%; object-fit:cover; display:block}
.card .pic{height:118px}
.card h3{font-size:.95rem; font-weight:500; line-height:1.25; margin-top:9px; min-height:2.5em}
.cardrow{display:flex; justify-content:space-between; align-items:center; margin-top:4px}
.price{font-weight:600; font-variant-numeric:tabular-nums; font-size:.95rem}
.plus{width:34px; height:34px; border-radius:50%; border:0; background:var(--palm); color:#fff; font-size:1.25rem; line-height:1; transition:transform .25s var(--spring)}
.plus:active{transform:scale(.85)}
.cats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cat{border:1px solid var(--line); background:var(--sheet); border-radius:20px; padding:14px; text-align:start; display:flex; align-items:center; gap:12px; transition:transform .2s var(--ease)}
.cat:active{transform:scale(.97)}
.cat i{font-style:normal; font-size:1.6rem}
.cat b{display:block; font-weight:500; line-height:1.2}
.cat span{color:var(--soft); font-size:.8rem}

/* ---------- menu ---------- */
.stick{position:sticky; top:0; z-index:3; background:var(--bg); margin:calc(-18px - var(--top)) -18px 0; padding:calc(18px + var(--top)) 18px 10px}
.search{margin:14px 0 12px}
.search input{width:100%; padding:13px 16px; border:1px solid var(--line); border-radius:16px; background:var(--sheet)}
.chips{display:flex; gap:8px; overflow-x:auto; margin:0 -18px; padding:0 18px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--line); background:var(--sheet); border-radius:999px; padding:8px 15px; font-weight:500; transition:background .25s, color .25s, border-color .25s}
.chip[aria-pressed="true"]{background:var(--palm); border-color:var(--palm); color:#fff}
.rows{background:var(--sheet); border-radius:24px; padding:2px 14px; margin-top:8px}
.rowitem{display:grid; grid-template-columns:84px 1fr; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; transition:background .4s}
.rowitem:last-child{border-bottom:0}
.rowitem .pic{width:84px; height:84px; font-size:2.2rem}
.rowitem.lit{background:var(--citron); margin:0 -14px; padding-inline:14px; border-radius:18px; border-bottom-color:transparent}
.rowitem h3{font-size:1rem; font-weight:500; line-height:1.25}
.rowitem p{font-size:.84rem; color:var(--soft); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.buy{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; min-height:34px}
.pop{font-size:.72rem; background:var(--citron); border-radius:6px; padding:1px 7px; margin-inline-start:6px; font-weight:500}
.rowitem.lit .pop{background:var(--sheet)}
.stepper{display:inline-flex; align-items:center; gap:4px; background:var(--palm); color:#fff; border-radius:999px; padding:2px}
.stepper.fresh{animation:pop .35s var(--spring)}
.stepper button{width:30px; height:30px; border-radius:50%; border:0; background:transparent; color:#fff; font-size:1.1rem; line-height:1}
.stepper span{min-width:18px; text-align:center; font-weight:600; font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.7); opacity:0}}
.none{padding:40px 8px; text-align:center; color:var(--soft)}

/* ---------- order ---------- */
.sheet{background:var(--sheet); border-radius:24px; padding:6px 16px 18px; margin-top:16px}
.lines li{display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center}
.lines small{color:var(--soft); grid-column:1 / -1}
.lines .stepper{background:var(--bg); color:var(--text); justify-self:start}
.lines .stepper button{color:var(--text)}
.sum{display:flex; justify-content:space-between; font-size:1.2rem; font-weight:600; margin-top:16px; font-variant-numeric:tabular-nums}
.vat{color:var(--soft); font-size:.85rem; margin-top:2px}
.cta{width:100%; border:0; background:var(--tomato); color:#fff; border-radius:18px; padding:16px; font-weight:500; font-size:1.02rem; margin-top:18px; transition:transform .2s var(--ease)}
.cta:active{transform:scale(.98)}
.outline{width:100%; border:1px solid var(--palm); background:transparent; border-radius:18px; padding:14px; font-weight:500; margin-top:14px}
.emptybox{text-align:center; padding:46px 10px 10px; color:var(--soft)}
.emptybox i{font-style:normal; font-size:2.6rem; display:block; margin-bottom:8px}
.builder{background:var(--bg); border-radius:16px; padding:12px 14px; margin-top:12px; font-size:.92rem}
.builder b{display:block; font-weight:600}
.bigno{font-size:3rem; font-weight:500; letter-spacing:-.04em; line-height:1; margin-top:14px}
.tag{display:inline-block; background:var(--citron); border-radius:8px; padding:3px 9px; font-size:.8rem; margin-top:10px}
.steps{margin-top:22px; counter-reset:s}
.steps li{position:relative; padding:0 0 24px; padding-inline-start:42px; color:var(--soft); counter-increment:s; transition:color .4s}
.steps li::before{content:counter(s); position:absolute; inset-inline-start:0; top:-3px; width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line);
  background:var(--sheet); display:grid; place-items:center; font-size:.8rem; font-weight:600; transition:background .4s, border-color .4s, transform .5s var(--spring)}
.steps li::after{content:""; position:absolute; inset-inline-start:13px; top:29px; bottom:1px; width:2px; background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done{color:var(--text)} .steps li.done::before{background:var(--ok); border-color:var(--ok); color:#fff} .steps li.done::after{background:var(--ok)}
.steps li.now{color:var(--text); font-weight:600} .steps li.now::before{background:var(--citron); border-color:var(--palm); transform:scale(1.12)}

/* ---------- more ---------- */
.group{background:var(--sheet); border-radius:22px; padding:4px 16px; margin-top:16px}
.setting{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting b{font-weight:500; display:block}
.setting span{color:var(--soft); font-size:.85rem}
.seg{display:flex; background:var(--bg); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; border-radius:999px; padding:7px 14px; font-weight:500; transition:background .25s, color .25s}
.seg button[aria-pressed="true"]{background:var(--palm); color:#fff}

/* ---------- bottom navigation ---------- */
.nav{position:absolute; inset-inline:12px; bottom:calc(12px + var(--bottom)); height:70px; z-index:20; background:var(--sheet); border:1px solid var(--line); border-radius:26px;
  display:grid; grid-template-columns:repeat(5,1fr); box-shadow:0 14px 34px rgba(14,59,46,.16)}
.blob{position:absolute; top:-13px; left:0; width:54px; height:54px; border-radius:50%; background:var(--citron); border:4px solid var(--bg); transition:transform .6s var(--spring); pointer-events:none}
.tab{position:relative; z-index:1; border:0; background:none; padding:0; display:grid; align-content:center; justify-items:center; gap:3px; font-size:.7rem; color:var(--soft); border-radius:20px}
.ico{position:relative; display:grid; transition:transform .55s var(--spring)}
.ico svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--text); font-weight:600}
.tab[aria-current="page"] .ico{transform:translateY(-14px)}
.lbl{transition:transform .4s var(--ease)}
.tab[aria-current="page"] .lbl{transform:translateY(-3px)}
.badge{position:absolute; top:-6px; inset-inline-end:-9px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--tomato); color:#fff; font-size:.68rem; font-weight:600;
  display:grid; place-items:center; font-style:normal}
.badge.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.5)}}
.talkslot{position:relative}
.talk{position:absolute; left:50%; top:-24px; width:68px; height:68px; margin-left:-34px; border:0; padding:0; background:transparent; border-radius:50%; transition:transform .3s var(--spring)}
.talk:active{transform:scale(.92)}
.talk::before{content:""; position:absolute; inset:-5px; border-radius:50%; background:var(--bg)}
.bite{position:absolute; inset:0; border-radius:50%; background:var(--tomato); -webkit-mask:radial-gradient(circle 17px at 86% 13%,#0000 97%,#000); mask:radial-gradient(circle 17px at 86% 13%,#0000 97%,#000)}
.talk svg,.talk .bars{position:absolute; inset:0; margin:auto}
.talk svg{width:28px; height:28px}
.bars{display:none; align-items:center; justify-content:space-between}
.talk .bars{width:30px; height:28px}
.bars i{width:4px; border-radius:2px; background:#fff; height:6px; transition:height .08s linear}
.talk.live svg{display:none} .talk.live .bars{display:flex}
.talk.live::after{content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--tomato); animation:ring 1.6s ease-out infinite}
@keyframes ring{from{opacity:.8; transform:scale(1)} to{opacity:0; transform:scale(1.45)}}
.livepill{position:absolute; inset-inline:12px; bottom:calc(98px + var(--bottom)); z-index:19; border:0; background:var(--palm); color:#fff; border-radius:16px; padding:11px 14px;
  display:flex; align-items:center; gap:10px; text-align:start; animation:rise .4s var(--ease)}
.livepill .dot{width:9px; height:9px; border-radius:50%; background:var(--citron); animation:ring 1.4s ease-out infinite alternate}
.fly{position:absolute; z-index:30; width:14px; height:14px; border-radius:50%; background:var(--tomato); pointer-events:none}
.toast{position:absolute; inset-inline:14px; top:calc(12px + var(--top)); z-index:60; background:var(--text); color:#fff; border-radius:16px; padding:12px 16px; animation:rise .3s var(--ease)}

/* ---------- voice mode: opens as a circle growing out of the talk button ---------- */
.voice{position:absolute; inset:0; z-index:40; background:var(--palm); color:#fff; display:grid; grid-template-rows:auto 1fr auto; gap:10px;
  padding:calc(16px + var(--top)) 20px calc(20px + var(--bottom)); visibility:hidden;
  clip-path:circle(0px at var(--cx,50%) var(--cy,100%)); transition:clip-path .55s var(--ease), visibility 0s .55s}
.voice.open{visibility:visible; clip-path:circle(150% at var(--cx,50%) var(--cy,100%)); transition:clip-path .7s var(--ease)}
.vtop{display:flex; justify-content:space-between; align-items:center}
.glass{border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; border-radius:999px; padding:9px 15px; font-weight:500; display:inline-flex; align-items:center; gap:8px}
.glass svg{width:18px; height:18px}
.vmid{display:grid; align-content:center; justify-items:center; gap:18px; min-height:0; overflow:hidden; text-align:center}
.orb{cursor:pointer; position:relative; width:150px; height:150px; --lvl:0; flex:none; margin:40px 0 22px}
.orb::before,.orb::after{content:""; position:absolute; inset:-14px; border-radius:50%; border:1.5px solid var(--citron); opacity:.55; transform:scale(calc(1 + var(--lvl) * .3)); transition:transform .09s linear}
.orb::after{inset:-34px; opacity:.22; transform:scale(calc(1 + var(--lvl) * .55))}
.orb .bite{-webkit-mask:radial-gradient(circle 38px at 86% 13%,#0000 98%,#000); mask:radial-gradient(circle 38px at 86% 13%,#0000 98%,#000)}
.orb .bars{position:absolute; inset:0; margin:auto; display:flex; width:64px; height:60px}
.orb .bars i{width:8px; border-radius:4px; height:10px}
.vstate{font-size:1.05rem; font-weight:500; max-width:26ch}
.vstate.bad{color:#FFD3C9}
.vnote{font-size:.82rem; color:#B9CFC4; max-width:30ch}
.caps{display:grid; gap:8px; width:100%; text-align:start}
.caps li{padding:10px 14px; border-radius:16px; font-size:.95rem; max-width:90%; animation:rise .35s var(--ease)}
.caps .assistant{background:var(--palm-2)}
.caps .user{background:var(--citron); color:var(--text); justify-self:end}
.spot{display:flex; align-items:center; gap:12px; background:var(--sheet); color:var(--text); border-radius:20px; padding:10px 14px 10px 10px; width:100%; text-align:start; animation:pop .45s var(--spring)}
.spot .pic{width:60px; height:60px; border-radius:16px; font-size:1.8rem; flex:none}
.spot b{font-weight:500; display:block; line-height:1.2}
.vbot{display:grid; gap:10px}
.vsum{justify-content:space-between; width:100%; border-radius:18px; padding:14px 16px}
.endbtn{border:0; background:var(--tomato); color:#fff; border-radius:18px; padding:16px; font-weight:500; font-size:1.02rem}
.voice .in{opacity:0; transform:translateY(12px); transition:opacity .5s var(--ease) .18s, transform .5s var(--ease) .18s}
.voice.open .in{opacity:1; transform:none}


/* ================= Bento UI: one grid, uniform gaps and corners, each block does one job ================= */
:root{ --r:26px; --gap:12px; --canvas:#E7EDE1 }
.app{background:var(--canvas)}
.view{padding:calc(14px + var(--top)) 12px calc(112px + var(--bottom))}
.bento{display:grid; grid-template-columns:1fr 1fr; gap:var(--gap)}
.bento > *{min-width:0; margin:0}
.span2{grid-column:span 2}
.b{background:var(--sheet); border-radius:var(--r); padding:16px; text-align:start; border:0; transition:transform .25s var(--ease)}
button.b:active,.cat:active,.rowitem:active{transform:scale(.975)}
.b-brand{display:flex; justify-content:space-between; align-items:center; padding:2px 6px 2px}
.pillbtn{border:0}
.hero{border-radius:var(--r); padding:22px 20px 20px; min-height:236px; display:flex; flex-direction:column}
.hero p{margin-bottom:18px}
.hero .startbtn{margin-top:auto; align-self:flex-start}
.b-store{display:flex; flex-direction:column; gap:2px; min-height:122px}
.b-store b{font-weight:600; font-size:1.08rem; line-height:1.2; margin-top:auto}
.b-store span:last-child{color:var(--soft); font-size:.88rem}
.b-menu{background:var(--citron); color:var(--text); display:flex; flex-direction:column; justify-content:space-between; font-weight:500; font-size:1.08rem; line-height:1.2; min-height:122px}
.b-menu svg{width:34px; height:34px; align-self:flex-end; transition:transform .3s var(--spring)}
.b-menu:hover svg{transform:translate(3px,-3px)}
[dir="rtl"] .b-menu svg{transform:scaleX(-1)}
.install{margin:0; border:0; border-radius:var(--r); padding:14px 16px}
.b-pop{padding:16px 0 14px}
.b-pop .h2{margin:0 16px 12px}
.b-label{margin:8px 6px -2px !important}
.rail{margin:0; padding:0 16px 2px; scroll-padding-inline:16px}
.card .pic{background:var(--canvas)}
.cats{gap:var(--gap)}
.cat{border:0; border-radius:var(--r); padding:16px; min-height:116px; align-items:flex-start; justify-content:space-between}
.cat i{order:2; font-size:2.3rem; align-self:flex-end; line-height:1; transition:transform .35s var(--spring)}
.cat:hover i{transform:scale(1.15) rotate(-6deg)}
.cat b{font-size:1.02rem}
.cat:first-child{grid-column:span 2; min-height:98px; align-items:center; background:var(--tomato); color:#fff}
.cat:first-child span span{color:#FFDCD4}
.cat:first-child b{font-size:1.2rem}
.cat:first-child i{align-self:center}
.cat:last-child:nth-child(even){grid-column:span 2; min-height:98px; align-items:center}
.cat:last-child:nth-child(even) i{align-self:center}

.stick{top:0; margin:calc(-14px - var(--top)) -12px 0; padding:calc(14px + var(--top)) 12px 10px; background:var(--canvas)}
.search input{border:0; border-radius:18px}
.chips{margin:0 -12px; padding:0 12px}
.chip{border:0}
.rows{background:transparent; padding:0; border-radius:0; display:grid; grid-template-columns:1fr 1fr; gap:var(--gap)}
.rowitem{display:flex; flex-direction:column; align-items:stretch; gap:10px; background:var(--sheet); border:0; border-radius:var(--r); padding:10px 10px 12px; transition:transform .25s var(--ease), background .4s}
.rowitem .pic{width:100%; height:112px; border-radius:18px; background:var(--canvas)}
.rowitem > div:last-child{display:flex; flex-direction:column; flex:1; padding:0 4px; min-width:0}
.rowitem .buy{margin-top:auto; padding-top:8px}
.rowitem.lit{margin:0; padding:10px 10px 12px; border-radius:var(--r)}
.rowitem.lit .pic{background:var(--sheet)}
.rowitem:first-child{grid-column:span 2; flex-direction:row; align-items:center; gap:14px}
.rowitem:first-child .pic{width:124px; height:124px; flex:none}
.rowitem:first-child h3{font-size:1.12rem}

.sheet{border-radius:var(--r); margin-top:var(--gap); padding:4px 16px}
.lines li:last-child{border-bottom:0}
.totalblock{background:var(--palm); color:#fff; border-radius:var(--r); padding:18px; margin-top:var(--gap)}
.totalblock .sum{margin-top:0; font-size:1.55rem; font-weight:500; letter-spacing:-.02em}
.totalblock .vat,.totalblock > span:first-child{color:#B9CFC4}
.totalblock .bigno{margin-top:2px}
.totalblock .tag{color:var(--text)}
#v-order .sheet .sum{margin:6px 0 14px}
#v-order .steps{margin-top:16px}
.cta{border-radius:var(--r); margin-top:var(--gap); padding:18px}
.outline{border-radius:var(--r); margin-top:var(--gap); border:0; background:var(--sheet)}
.builder{border-radius:var(--r); background:var(--citron); margin-top:var(--gap); padding:16px}
.emptybox{background:var(--sheet); border-radius:var(--r); margin-top:var(--gap); padding:40px 16px}
.group{border-radius:var(--r); margin-top:var(--gap)}
.nav{border:0; border-radius:var(--r)}
.blob{border-color:var(--canvas)}
.talk::before{background:var(--canvas)}
.livepill{border-radius:20px}

/* logo, photos, plate */
.logo{width:34px; height:30px; flex:none; display:block}
.name{gap:8px} .name .wv{color:var(--palm)} .name .wb{color:var(--tomato)}
.voice{--logo-v:#fff} .voice .name .wv{color:#fff}
.pic,.card .pic,.rowitem .pic,.rowitem.lit .pic{background:#fff}
.pic img{object-fit:contain; padding:4px}
.caps li:empty{display:none}
.plate{display:inline-block; margin-top:10px; background:#fff; color:var(--text); border-radius:8px; padding:4px 11px; font-weight:600; letter-spacing:.04em}

/* product cards in voice mode: the attendant shows them instead of reading the menu out */
.orb{transition:width .4s var(--ease), height .4s var(--ease), margin .4s var(--ease)}
.shelfwrap{width:100%; min-width:0; text-align:start; animation:rise .4s var(--ease)}
.shelfhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:0 2px 8px; font-size:.8rem; color:#B9CFC4}
.shelfhead b{color:#fff; font-weight:500; font-size:.98rem}
.shelf{display:flex; gap:10px; overflow-x:auto; padding:2px 0 4px; scroll-snap-type:x proximity; scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf .card{width:148px; background:var(--sheet); color:var(--text); border-radius:20px; padding:8px 8px 10px; transition:background .4s}
.shelf .card .pic{height:96px; border-radius:14px}
.shelf .card h3{font-size:.88rem; margin-top:7px; padding:0 2px}
.shelf .cardrow{padding:0 2px} .shelf .price{white-space:nowrap; font-size:.9rem}
.shelf .card.lit{background:var(--citron)}
.voice.shelf-on .vmid{align-content:start; gap:12px}
.voice.shelf-on .orb{width:64px; height:64px; margin:12px 0 6px}
.voice.shelf-on .orb::before{inset:-7px} .voice.shelf-on .orb::after{inset:-16px}
.voice.shelf-on .orb .bite{-webkit-mask:radial-gradient(circle 16px at 86% 13%,#0000 98%,#000); mask:radial-gradient(circle 16px at 86% 13%,#0000 98%,#000)}
.voice.shelf-on .orb .bars{width:28px; height:26px} .voice.shelf-on .orb .bars i{width:4px; border-radius:2px}
.voice.shelf-on .caps li:nth-last-child(n+3){display:none}

/* "5 minutes away" and "I'm here" on the placed order */
.arrive{padding:16px}
.arrive h2{font-size:1.05rem; font-weight:600}
.arrive .vat{margin-top:4px}
.arrbtns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.abtn{border:0; border-radius:18px; padding:14px 10px; font-weight:500; line-height:1.2; background:var(--citron); color:var(--text); transition:transform .2s var(--ease)}
.abtn.go{background:var(--tomato); color:#fff}
.abtn:active{transform:scale(.97)}
.abtn:disabled{background:var(--canvas); color:var(--soft); cursor:default; transform:none}
.abtn.done:disabled{background:var(--ok); color:#fff}
.georow{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:.86rem; color:var(--soft)}
.georow .dot{width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none}
.georow span{flex:1}

/* voice language: English, Arabic or Malayalam, picked here or by asking the attendant */
.vlang{display:flex; gap:4px; padding:3px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18)}
.vlang button{flex:1; border:0; background:transparent; color:#D7E6DD; border-radius:999px; padding:9px 6px; font-weight:500; font-size:.92rem; line-height:1.3; transition:background .25s, color .25s}
.vlang button[aria-pressed="true"]{background:var(--citron); color:var(--text)}
.setting.wrap{flex-wrap:wrap}
.seg.three button{padding:7px 12px}


/* ================= wow layer, in the VoiceBite palette ================= */
.ticker{overflow:hidden; background:#141210; color:#FFF6E0; border:2px solid #141210; border-radius:14px; box-shadow:3px 3px 0 rgba(20,18,16,.35); transform:rotate(-1.2deg); margin:4px 2px}
.track{display:flex; align-items:center; gap:14px; width:max-content; padding:10px 0; animation:tick 22s linear infinite; font-weight:700; font-size:1.02rem; letter-spacing:-.01em; text-transform:uppercase; white-space:nowrap}
.track i{font-style:normal; color:#FFC21A; font-size:.8rem}
.track span:nth-of-type(5n+1),.track span:nth-of-type(5n+5){color:#FF5A36}
[dir="rtl"] .track{animation-direction:reverse}
@keyframes tick{to{transform:translateX(-50%)}}
.boing{animation:boing .5s var(--spring)}
@keyframes boing{30%{transform:scale(1.08,.9)} 60%{transform:scale(.96,1.05)}}
.vbot{display:flex; flex-direction:column} .vbot .vsum{order:-1}
.voice .vsum{display:block; background:#fff; color:var(--text); border:0; border-radius:18px 18px 4px 4px; padding:12px 16px 16px; text-align:start;
  -webkit-mask:radial-gradient(circle 5px at 50% 100%,#0000 98%,#000) 0 0/14px 100% repeat-x; mask:radial-gradient(circle 5px at 50% 100%,#0000 98%,#000) 0 0/14px 100% repeat-x}
.rhead{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1.5px dashed var(--line); padding-bottom:6px; margin-bottom:6px}
.rhead b{font-weight:600; font-size:1rem}
.rhead i{font-style:normal; font-size:.78rem; color:var(--soft)}
.rlines li{display:grid; grid-template-columns:28px 1fr auto; gap:6px; padding:3px 0; font-size:.92rem; align-items:baseline}
.rlines li span:first-child{font-weight:600; color:var(--soft)}
.rlines li b{font-weight:600; font-variant-numeric:tabular-nums}
.rlines .rmore{display:block; font-size:.78rem; color:var(--soft)}
.rlines li.new{animation:stampin .55s var(--spring) both; background:linear-gradient(var(--citron),var(--citron)) 0 60%/100% 60% no-repeat; border-radius:6px}
@keyframes stampin{from{opacity:0; transform:translateY(-10px) scale(1.12)}}
.rtot{display:flex; justify-content:space-between; align-items:baseline; border-top:1.5px solid var(--text); margin-top:6px; padding-top:6px}
.rtot span{font-size:.85rem; color:var(--soft)}
.rtot b{font-weight:600; font-size:1.35rem; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.party{position:absolute; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; background:rgba(7,30,23,.4); animation:fadeout 2.6s ease forwards}
.stamp{display:grid; justify-items:center; gap:2px; background:var(--citron); color:var(--palm); border:3px solid var(--palm); border-radius:22px; padding:16px 28px; transform:rotate(-6deg); box-shadow:0 20px 50px rgba(0,0,0,.35); animation:stamp .6s cubic-bezier(.2,1.6,.4,1) both}
.stamp b{font-weight:600; font-size:2.5rem; letter-spacing:-.04em; line-height:1}
.stamp small{font-weight:500; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em}
.party i{position:absolute; left:50%; top:50%; width:11px; height:11px; border-radius:3px; opacity:0; animation:burst 1.3s cubic-bezier(.15,.7,.3,1) var(--d) forwards}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.4); opacity:0} 60%{transform:rotate(-6deg) scale(.92); opacity:1}}
@keyframes burst{0%{opacity:1; transform:translate(-50%,-50%) scale(.4)} 100%{opacity:0; transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) + 140px)) rotate(var(--r)) scale(1)}}
@keyframes fadeout{0%,75%{opacity:1} 100%{opacity:0}}
.cat > span{color:inherit}
.shelf .cardrow{gap:4px} .shelf .stepper{padding:1px; gap:0} .shelf .stepper button{width:24px; height:26px} .shelf .stepper span{min-width:14px; font-size:.85rem}

/* ================= browse the menu: drawn icons, one grid, a tone per tile ================= */
.cats{gap:var(--gap)}
.cat,.cat:first-child,.cat:last-child:nth-child(even){position:relative; height:132px; min-height:0; padding:16px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:0; overflow:hidden; text-align:start}
.cat > span{display:block; color:inherit}
.cat b,.cat:first-child b{font-size:1.08rem; font-weight:600; letter-spacing:-.015em; line-height:1.2}
.cat > span > span,.cat:first-child span span{font-size:.8rem; color:inherit; opacity:.7}
.cat i,.cat:first-child i,.cat:last-child:nth-child(even) i{order:0; align-self:flex-start; width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:0; background:var(--canvas); color:var(--palm); transition:transform .35s var(--spring)}
.cat i svg{width:24px; height:24px}
.cat:hover i{transform:rotate(-6deg) scale(1.06)}
.cat .go{position:absolute; top:16px; inset-inline-end:16px; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; border:1.5px solid currentColor; opacity:.55; transition:transform .3s var(--spring), opacity .2s}
.cat .go svg{width:14px; height:14px}
.cat:hover .go{opacity:1; transform:translate(2px,-2px)}
[dir="rtl"] .cat .go svg{transform:scaleX(-1)}
/* a different tone for each tile, all from the VoiceBite palette */
.cat{background:var(--sheet); color:var(--text)}
.cat:nth-child(1){background:var(--tomato); color:#fff}
.cat:nth-child(1) i{background:rgba(255,255,255,.18); color:#fff}
.cat:nth-child(2){background:var(--palm); color:#fff}
.cat:nth-child(2) i{background:rgba(215,242,90,.16); color:var(--citron)}
.cat:nth-child(3){background:var(--citron); color:var(--palm)}
.cat:nth-child(3) i{background:rgba(14,59,46,.1)}
.cat:nth-child(6){background:#F6E7D3}
.cat:nth-child(6) i{background:#fff}
/* full-width tiles lie flat: icon, name, arrow on one line */
.cat:first-child,.cat:last-child:nth-child(even){height:88px; flex-direction:row; align-items:center; justify-content:flex-start; gap:14px; padding-inline-end:60px}
.cat:first-child i,.cat:last-child:nth-child(even) i{align-self:center}
.cat:first-child .go,.cat:last-child:nth-child(even) .go{top:50%; margin-top:-15px}
.cat:first-child b{font-size:1.2rem}

/* voice screen: the conversation scrolls on its own, pinned to the newest line, so nothing hides behind the receipt */
.vmid{display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; min-height:0}
.vmid > *{flex:none}
.voice:not(.shelf-on) .orb{margin-top:auto}
.caps{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:8px; padding:4px 2px 6px; scrollbar-width:none;
  -webkit-mask:linear-gradient(transparent 0, #000 18px); mask:linear-gradient(transparent 0, #000 18px)}
.caps::-webkit-scrollbar{display:none}
.caps li:first-child{margin-top:auto}
.caps .user{align-self:flex-end} .caps .assistant{align-self:flex-start}
.voice.shelf-on .caps li:nth-last-child(n+3){display:block}
.voice:has(.vsum:not([hidden])) .shelf .card .pic{height:76px} .shelf .card .pic{display:block} .shelf .card .pic img{width:100%; height:100%; object-fit:contain}
.voice:has(.vsum:not([hidden])) .shelf .card h3{min-height:0; margin-top:4px}
.voice:has(.vsum:not([hidden])) .orb{margin-top:4px; margin-bottom:4px}

/* VoiceBite Rewards */
.rwcard{position:relative; overflow:hidden; background:var(--palm); color:#fff; border-radius:var(--r); padding:18px; margin-top:var(--gap); display:grid; gap:10px}
.rwcard::after{content:""; position:absolute; inset-inline-end:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:rgba(215,242,90,.12); pointer-events:none}
.rwtop{display:flex; justify-content:space-between; align-items:center}
.rwbrand{color:var(--citron); font-weight:600; letter-spacing:.02em}
.rwcard .x{color:#B9CFC4; font-size:.82rem}
.rwlead{color:#C9DDD2; font-size:.92rem; margin-bottom:2px}
.rwcard label{display:grid; gap:5px; font-size:.82rem; color:#C9DDD2}
.rwcard input{width:100%; padding:12px 14px; border:0; border-radius:14px; background:#fff; color:var(--text); font-size:1rem}
.rwcard #rwPin{letter-spacing:.5em; font-weight:600}
.rwcard .cta{margin-top:4px; padding:14px}
.rwerr{color:#FFD3C9; font-size:.86rem; min-height:0} .rwerr:empty{display:none}
.rwswitch{color:var(--citron); justify-self:center; font-size:.9rem}
.rwpts{font-size:1rem; color:#C9DDD2; margin-top:4px} .rwpts b{font-size:3rem; font-weight:500; letter-spacing:-.04em; color:#fff; line-height:1; margin-inline-end:4px}
.rwworth{color:#B9CFC4; font-size:.9rem}
.rwcode{display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,.08); border-radius:16px; padding:10px 10px 10px 14px}
.rwcode span{display:block; font-size:.75rem; color:#B9CFC4} .rwcode b{font-size:1.25rem; font-weight:600; letter-spacing:.08em; color:var(--citron)}
.rwcode .solid{background:var(--citron); color:var(--text)}
.rwnote{font-size:.8rem; color:#B9CFC4}
.rwearned{font-weight:600; color:var(--ok); white-space:nowrap}
.rwline{display:grid; gap:2px; width:100%; text-align:start; background:var(--citron); color:var(--text); border:0; border-radius:var(--r); padding:14px 16px; margin-top:var(--gap); font-size:.9rem}
.rwline b{font-weight:600}

/* tappable answers in voice mode */
.choices{width:100%; text-align:start; animation:rise .35s var(--ease)}
.flow{list-style:none; display:flex; gap:4px; width:100%; margin:2px 0 4px; padding:0}
.flow li{flex:1; display:grid; justify-items:center; gap:4px; font-size:.68rem; font-weight:600; color:rgba(255,255,255,.5); text-align:center; line-height:1.15}
.flow li i{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:.75rem; background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.18)}
.flow li.done{color:#D7F25A} .flow li.done i{background:#D7F25A; color:#0B2A20; border-color:#D7F25A}
.flow li.now{color:#fff} .flow li.now i{background:#fff; color:#0B2A20; border-color:#fff; box-shadow:0 0 0 4px rgba(215,242,90,.3)}
.choices p{font-size:.85rem; color:#B9CFC4; margin:0 2px 8px}
.choices div{display:flex; flex-wrap:wrap; gap:8px}
.choices button{border:0; background:#fff; color:var(--text); border-radius:999px; padding:11px 18px; font-weight:600; font-size:1rem; transition:transform .15s var(--spring), background .2s}
.choices button:active{transform:scale(.94)} .choices button.picked{background:var(--citron)}

/* fruit basket */
.basket{background:#fff; border-radius:var(--r); padding:16px; margin-top:var(--gap); display:grid; gap:10px}
.bhead{display:flex; justify-content:space-between; align-items:baseline} .bhead b{font-weight:600; font-size:1.05rem} .bhead span{font-weight:600; color:var(--soft)}
.bslots{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.bslot{position:relative; aspect-ratio:1; border-radius:14px; background:var(--bg); display:grid; place-items:center; transition:transform .3s var(--spring)}
.bslot svg{filter:grayscale(1) opacity(.28)} .bslot.got{background:#FFF4DC} .bslot.got svg{filter:none}
.bslot i{position:absolute; top:-4px; inset-inline-end:-4px; font-style:normal; font-size:.66rem; font-weight:700; background:var(--palm); color:#fff; border-radius:999px; padding:1px 5px}
.bnote{font-weight:600} .bhow{font-size:.8rem; color:var(--soft)}
.voucher{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--citron); border-radius:14px; padding:10px 14px; border:2px dashed var(--palm)}
.voucher span{display:grid} .voucher small{font-size:.72rem} .voucher b{font-weight:600} .voucher code{font-size:1.15rem; font-weight:700; letter-spacing:.08em; font-family:inherit}
.rushbtn{display:flex; align-items:center; gap:12px; width:100%; text-align:start; border:0; border-radius:var(--r); padding:14px 16px; margin-top:var(--gap); background:radial-gradient(1.5px 1.5px at 72% 30%,#EAF7D0 50%,transparent 51%),radial-gradient(1px 1px at 86% 70%,#EAF7D0 50%,transparent 51%),radial-gradient(1px 1px at 60% 80%,#EAF7D0 50%,transparent 51%),radial-gradient(circle at 100% 0,rgba(215,242,90,.28),transparent 55%),linear-gradient(120deg,#0B2E22,#145A3E); color:#fff; box-shadow:inset 0 0 0 1px rgba(215,242,90,.25); animation:rise .4s var(--ease)}
.rushbtn b{color:#fff} .rushbtn small{color:#D7F25A}
.rushbtn span:last-child{display:grid} .rushbtn b{font-weight:600; font-size:1.02rem} .rushbtn small{opacity:.88; font-size:.82rem}
.rushfruits{display:flex} .rushfruits svg{margin-inline-end:-12px; filter:drop-shadow(0 0 6px rgba(215,242,90,.35))}
/* Meteor Slice */
.slice{position:absolute; inset:0; z-index:80; background:#06231A; color:#fff; touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden; animation:rise .3s var(--ease)}
.slice canvas{position:absolute; inset:0; display:block}
.shud{position:absolute; inset:calc(12px + var(--top)) 14px auto; display:flex; align-items:center; gap:10px; z-index:2}
.spill{font-size:1.2rem; font-weight:700; min-width:64px; text-align:center; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(8px); border-radius:999px; padding:5px 16px; font-variant-numeric:tabular-nums; transition:background .3s, color .3s}
.spill.hit{background:#D7F25A; color:#0B2A20; box-shadow:0 0 18px rgba(215,242,90,.6)} .spill small{font-size:.7rem; font-weight:600; opacity:.6; margin-inline-start:2px}
.slives{flex:1; color:#FF6B5A; font-size:1.15rem; letter-spacing:2px} .slives s{text-decoration:none; opacity:.25}
.sx{color:#fff; font-size:1.2rem; background:rgba(255,255,255,.12); width:38px; height:38px; border-radius:50%; border:0}
.stime{position:absolute; inset:calc(58px + var(--top)) 16px auto; height:5px; border-radius:4px; background:rgba(255,255,255,.12); z-index:2; overflow:hidden}
.stime i{display:block; height:100%; background:linear-gradient(90deg,#D7F25A,#7ED957); transform-origin:left; border-radius:4px}
[dir=rtl] .stime i{transform-origin:right}
.sintro{position:absolute; inset:0; z-index:3; display:grid; place-content:center; justify-items:center; gap:14px; text-align:center; padding:24px}
.sintro h2{font-size:2.1rem; font-weight:700; letter-spacing:-.03em; text-shadow:0 0 24px rgba(215,242,90,.35)} .sintro .skick{font-size:.78rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:#D7F25A; opacity:.85; margin-bottom:-8px}
.sorb{position:relative; width:180px; height:180px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle,rgba(215,242,90,.22),rgba(215,242,90,.04) 62%,transparent 70%); border:1px solid rgba(215,242,90,.25); box-shadow:0 0 0 14px rgba(215,242,90,.04), 0 0 80px rgba(215,242,90,.22); animation:sorb 2.4s ease-in-out infinite}
@keyframes sorb{50%{transform:translateY(-8px) scale(1.03)}}
.scomet{position:absolute; width:120px; height:5px; border-radius:6px; background:linear-gradient(90deg,transparent,#FF8A3D 60%,#FFF6D8); box-shadow:0 0 12px #FF8A3D; top:16px; inset-inline-start:-40px; transform:rotate(28deg); animation:scomet 1.8s linear infinite}
@keyframes scomet{from{transform:translate(-40px,-30px) rotate(28deg); opacity:0} 30%{opacity:1} to{transform:translate(160px,60px) rotate(28deg); opacity:0}}
.shalf{position:absolute; transition:transform .5s var(--ease), opacity .5s} .shalf.l{clip-path:inset(0 50% 0 0)} .shalf.r{clip-path:inset(0 0 0 50%)}
.sslash{position:absolute; width:0; height:4px; background:#fff; box-shadow:0 0 14px #D7F25A; transform:rotate(-30deg); border-radius:4px}
.sintro.cut .shalf.l{transform:translate(-34px,26px) rotate(-22deg); opacity:0} .sintro.cut .shalf.r{transform:translate(34px,-14px) rotate(18deg); opacity:0}
.sintro.cut .sslash{width:220px; transition:width .18s} .sintro.cut .scomet{display:none}
.shint{font-weight:600; color:#D7F25A; letter-spacing:.02em; animation:pulse 1.6s ease-in-out infinite} .srules{color:#C9DDD2; max-width:30ch; font-size:.92rem}
@keyframes pulse{50%{opacity:.55}}
.sload{position:relative; width:96px; height:96px; display:grid; place-items:center} .splanet{width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#3E8B63,#0F3F2D 70%); box-shadow:0 0 24px rgba(215,242,90,.45), inset -6px -6px 12px rgba(0,0,0,.4)}
.sorbit{position:absolute; inset:-6px; animation:spin 1.4s linear infinite} .sorbit i{position:absolute; top:-4px; left:50%; margin-left:-11px; filter:drop-shadow(0 0 6px #D7F25A)}
.sload span{position:absolute; inset:0; border-radius:50%; border:4px solid rgba(215,242,90,.2); border-top-color:#D7F25A; animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sres{position:absolute; inset:0; z-index:4; display:grid; place-content:center; justify-items:center; gap:12px; text-align:center; padding:28px; background:rgba(4,22,16,.82); backdrop-filter:blur(4px); animation:rise .35s var(--ease)}
.sres h2{font-size:1.9rem; font-weight:700; letter-spacing:-.03em} .sres p{color:#C9DDD2; max-width:30ch} .sres .sk{color:#D7F25A; font-weight:600} .scoins{background:#D7F25A; color:#0B2A20 !important; font-weight:700; border-radius:999px; padding:6px 14px}
.sres.win{background:radial-gradient(circle at 50% 38%,rgba(215,242,90,.25),rgba(4,22,16,.9) 60%)}
.sres.win .sprize{position:relative} .sres.win .sprize::before{content:""; position:absolute; inset:-50px; -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%); mask:radial-gradient(circle,#000 30%,transparent 70%); background:repeating-conic-gradient(rgba(215,242,90,.16) 0 10deg,transparent 10deg 20deg); border-radius:50%; animation:spin 12s linear infinite; z-index:-1}
.sprize{animation:pop .6s var(--spring)} .sres.lose .sprize{filter:grayscale(.3); opacity:.9}
.smini{display:flex; gap:6px; background:rgba(255,255,255,.08); border-radius:16px; padding:8px 10px} .smini i{opacity:.28; filter:grayscale(1)} .smini i.got{opacity:1; filter:none} .smini i.new{animation:pop .6s .4s var(--spring) both}
.sbtn{margin-top:8px; border:0; border-radius:999px; padding:14px 38px; font-weight:700; font-size:1rem; background:#D7F25A; color:#0B2A20}
.rprize{animation:pop .6s var(--spring)}
/* Before the first order: name + mobile, or member sign-in */
.onb{position:absolute; inset:0; z-index:85; display:grid; align-items:end; background:rgba(5,25,18,.55); backdrop-filter:blur(4px); animation:rise .25s var(--ease)}
.onbcard{position:relative; background:#fff; border-radius:28px 28px 0 0; padding:26px 20px calc(22px + var(--bottom)); display:grid; gap:12px; animation:rise .35s var(--spring)}
.onbcard h2{font-size:1.6rem; font-weight:700; letter-spacing:-.03em} .onbsub{color:var(--soft); margin-top:-6px}
.onbx{position:absolute; top:16px; inset-inline-end:16px}
.onbtabs{display:grid; grid-template-columns:1fr 1fr; background:#EEF3EA; border-radius:999px; padding:4px}
.onbtabs button{border:0; background:none; border-radius:999px; padding:10px; font-weight:600; color:var(--soft)} .onbtabs [aria-selected="true"]{background:#0F3F2D; color:#fff}
.onbcard label{display:grid; gap:6px; font-size:.86rem; font-weight:600}
.onbcard input:not([type=checkbox]){border:1.5px solid #DDE5D8; border-radius:14px; padding:13px 14px; font:inherit; font-size:1.05rem}
.onbcard .onbchk{display:flex; gap:10px; align-items:center; font-weight:500}
.onbpriv{font-size:.8rem; color:var(--soft); text-align:center}
.pickup{display:grid; gap:2px; margin-top:10px; font-size:.9rem} .pickup span{opacity:.75; font-size:.82rem}
/* Kiosk mode: one customer at a time on a shared screen */
body.kiosk .tab[data-go="more"], body.kiosk #installCard{display:none !important}
.kiosk{position:absolute; inset:0; z-index:90; color:#fff; animation:rise .3s var(--ease)}
.k-idle{display:grid; grid-template-rows:auto 1fr auto; padding:calc(22px + var(--top)) 24px calc(22px + var(--bottom)); text-align:center;
  background:radial-gradient(circle at 50% 46%,rgba(215,242,90,.16),transparent 55%),linear-gradient(170deg,#0B2E22,#0F3F2D 55%,#145A3E)}
.k-top{display:flex; justify-content:space-between; align-items:center} .k-brand{font-size:1.25rem; font-weight:700; letter-spacing:-.02em}
.k-lane{font-size:.82rem; font-weight:600; color:#0B2A20; background:#D7F25A; border-radius:999px; padding:5px 12px}
.k-mid{display:grid; place-content:center; justify-items:center; gap:14px}
.k-mid h1{font-size:2.6rem; font-weight:700; letter-spacing:-.04em; line-height:1.05} .k-mid p{color:#C9DDD2; max-width:28ch; font-size:1.02rem}
.k-mic{position:relative; width:150px; height:150px; margin-top:18px; border-radius:50%; border:0; background:#D7F25A; color:#0B2A20; display:grid; place-items:center; box-shadow:0 18px 50px rgba(215,242,90,.35)}
.k-ring{position:absolute; inset:-14px; border-radius:50%; border:2px solid rgba(215,242,90,.5); animation:kring 2.2s ease-out infinite} .k-ring.r2{animation-delay:1.1s}
@keyframes kring{from{transform:scale(.85); opacity:1} to{transform:scale(1.35); opacity:0}}
.k-tap{font-size:1.1rem; color:#D7F25A; margin-top:6px}
.k-idle.hears .k-tap::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:#D7F25A; margin-inline-end:8px; vertical-align:middle; animation:pulse 1.4s ease-in-out infinite}
.k-langs{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center}
.k-langs button{border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#fff; border-radius:999px; padding:9px 16px; font-weight:600; font-size:.92rem}
.k-langs button[aria-pressed="true"]{background:#fff; color:#0B2A20; border-color:#fff}
.k-privacy{font-size:.82rem; color:#9FBFB0}
.k-ask,.k-handoff{display:grid; place-items:center; padding:24px; background:rgba(5,25,18,.72); backdrop-filter:blur(6px)}
.k-card{width:min(100%,380px); background:#fff; color:var(--text); border-radius:28px; padding:28px 22px 22px; text-align:center; display:grid; justify-items:center; gap:10px; box-shadow:0 30px 80px rgba(0,0,0,.35); animation:pop .45s var(--spring)}
.k-card h2{font-size:1.6rem; font-weight:700; letter-spacing:-.03em} .k-card p{color:var(--soft)}
.k-btn{width:100%; border:0; border-radius:999px; padding:15px; font-weight:700; font-size:1.05rem; background:#0F3F2D; color:#fff; margin-top:6px}
.k-link{border:0; background:none; color:var(--soft); font-weight:600; padding:6px}
.k-check{width:62px; height:62px; border-radius:50%; background:#D7F25A; color:#0B2A20; display:grid; place-items:center}
.k-order{display:grid; line-height:1} .k-order span{font-size:.8rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--soft)} .k-order b{font-size:3.2rem; font-weight:700; letter-spacing:-.04em}
.k-facts{display:flex; gap:8px; align-items:center; font-weight:600} .k-plate{background:#0F3F2D; color:#fff; border-radius:8px; padding:4px 10px; letter-spacing:.06em}
.k-qrbox{display:flex; align-items:center; gap:12px; text-align:start; background:#F2F6EE; border-radius:18px; padding:10px 12px; margin-top:4px}
.k-qr{width:96px; height:96px; flex:none; background:#fff; border-radius:10px; overflow:hidden; font-size:.6rem; word-break:break-all} .k-qr svg{width:100%; height:100%; display:block}
.k-qrbox small{font-size:.84rem; color:var(--text); font-weight:500}
.k-next{font-size:.85rem}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
