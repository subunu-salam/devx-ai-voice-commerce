<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<link rel="icon" href="icon-192.png">
<title>VoiceBite console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --palm:#0E3B2E; --palm-2:#185740; --deep:#071E17; --tomato:#F0462B; --citron:#D7F25A; --bg:#F5F8F1; --sheet:#FFFFFF;
  --text:#12241D; --soft:#637169; --line:#E2E8DC; --ok:#1B8A4B; --warn:#B25E00; --bad:#C22E17;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1); --font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; font-family:var(--font); color:var(--text); background:var(--bg); line-height:1.45; font-size:15px}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1F6FEB; outline-offset:2px}
[hidden]{display:none !important}
h1,h2,h3,p,ul{margin:0; padding:0} ul{list-style:none}
.mark{width:22px; height:22px; border-radius:50%; background:var(--tomato); flex:none; display:inline-block;
  -webkit-mask:radial-gradient(circle 7px at 88% 12%,#0000 97%,#000); mask:radial-gradient(circle 7px at 88% 12%,#0000 97%,#000)}
.name{display:flex; align-items:center; gap:9px; font-weight:600; font-size:1.2rem; letter-spacing:-.02em}
.by{display:flex; align-items:center; gap:7px; font-size:.78rem; color:var(--soft)}
.by img{height:22px}

/* sign in */
.login{min-height:100%; display:grid; place-items:center; padding:20px; background:radial-gradient(900px 600px at 20% 10%, #12402F 0%, transparent 60%), var(--deep)}
.loginbox{width:100%; max-width:380px; background:var(--bg); border-radius:30px; padding:30px 26px}
.loginbox h1{font-size:1.9rem; font-weight:400; letter-spacing:-.03em; margin:22px 0 4px}
.loginbox p{color:var(--soft); margin-bottom:8px}

/* shell */
.shell{display:grid; grid-template-columns:250px minmax(0,1fr); height:100%}
.side{background:var(--palm); color:#fff; padding:20px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:6px}
.side .name{padding:0 8px 4px}
.side small{display:block; color:#9DBBAC; font-size:.72rem; padding:14px 10px 4px}
.navlink{display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; color:#D5E6DC; text-align:start; padding:9px 10px; border-radius:12px; position:relative; transition:background .25s, color .25s}
.navlink:hover{background:rgba(255,255,255,.07)}
.navlink[aria-current="page"]{background:var(--citron); color:var(--text); font-weight:500}
.navlink i{font-style:normal; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--tomato); color:#fff; font-size:.7rem; display:grid; place-items:center; margin-inline-start:auto}
.who{margin-top:auto; padding:14px 10px 0; font-size:.85rem; color:#B9CFC4; border-top:1px solid rgba(255,255,255,.12)}
.who b{color:#fff; font-weight:500; display:block}
.main{display:flex; flex-direction:column; min-width:0; height:100%}
.bar{display:flex; align-items:center; gap:12px; padding:16px 24px 10px}
.bar h1{font-size:clamp(1.25rem,5vw,1.7rem); font-weight:500; letter-spacing:-.03em; margin-inline-end:auto; min-width:0}
.menubtn{display:none; border:1px solid var(--line); background:var(--sheet); border-radius:12px; padding:8px 11px}
#view{flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 24px 40px}
.msg{margin:0 24px; min-height:0; font-weight:500}
.msg:not(:empty){background:var(--text); color:#fff; border-radius:14px; padding:10px 14px; margin-bottom:8px; animation:rise .3s var(--ease)}
.msg.bad:not(:empty){background:var(--bad)}
@keyframes rise{from{opacity:0; transform:translateY(8px)}}
#view > *{animation:rise .35s var(--ease)}

/* controls */
label{display:block; font-weight:500; font-size:.85rem; margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=datetime-local],input[type=search],input[type=tel],select,textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--sheet)}
textarea{min-height:80px; resize:vertical}
.btn{border:0; background:var(--palm); color:#fff; border-radius:999px; padding:9px 16px; font-weight:500; white-space:nowrap; transition:transform .2s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.hot{background:var(--tomato)} .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line)} .btn.warn{background:transparent; color:var(--bad); border:1px solid var(--bad)}
.btn.sm{padding:6px 12px; font-size:.86rem}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 14px}
.tools .grow{flex:1}
.tabs{display:inline-flex; flex-wrap:wrap; max-width:100%; background:var(--sheet); border:1px solid var(--line); border-radius:22px; padding:3px}
.tabs button{border:0; background:transparent; border-radius:999px; padding:7px 14px; font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--palm); color:#fff}
.check{display:flex; gap:8px; align-items:center; font-weight:500; margin-top:12px}
.check input{width:18px; height:18px}

/* content */
.card{background:var(--sheet); border-radius:20px; padding:16px; margin-bottom:16px}
.card.flush{padding:4px 0}
.card h2{font-size:1.02rem; font-weight:600; margin-bottom:10px}
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse}
th{font-size:.78rem; text-align:start; color:var(--soft); padding:10px 14px 6px; font-weight:500; white-space:nowrap}
td{padding:10px 14px; border-top:1px solid var(--line); vertical-align:middle; font-variant-numeric:tabular-nums}
td.r,th.r{text-align:end} td.a{white-space:nowrap; text-align:end}
tr.click{cursor:pointer} tr.click:hover td{background:#FAFCF7}
.soft{color:var(--soft)} .small{font-size:.84rem}
.pill{display:inline-block; border-radius:999px; padding:2px 10px; font-size:.78rem; font-weight:500; background:var(--bg); white-space:nowrap}
.pill.ok{background:#DDF3E5; color:#0F5E32} .pill.warn{background:#FFE9C7; color:#7A4100} .pill.bad{background:#FFD9D1; color:#8E1D0B} .pill.hi{background:var(--citron)}
.tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:16px}
.tile{background:var(--sheet); border-radius:20px; padding:16px}
.tile b{display:block; font-size:1.7rem; font-weight:500; letter-spacing:-.03em; line-height:1.15}
.tile span{color:var(--soft); font-size:.86rem}
.grid2{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fields{display:grid; gap:0 16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.empty{padding:34px 12px; text-align:center; color:var(--soft)}
.alert{display:flex; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.alert div{flex:1}
.bars{display:flex; align-items:flex-end; gap:5px; height:160px}
.bars div{flex:1; background:var(--palm); border-radius:6px 6px 0 0; min-height:2px}
.bars div.zero{background:var(--line)}
.axis{display:flex; gap:5px; font-size:.68rem; color:var(--soft); margin-top:4px}
.axis span{flex:1; text-align:center; overflow:hidden}
.meter{height:8px; border-radius:4px; background:var(--bg); overflow:hidden}
.meter i{display:block; height:100%; background:var(--palm); border-radius:4px}

/* dashboard */
.dash{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px}
.dash > *{margin:0; min-width:0}
.s3{grid-column:span 3} .s4{grid-column:span 4} .s5{grid-column:span 5} .s6{grid-column:span 6} .s7{grid-column:span 7} .s8{grid-column:span 8} .s12{grid-column:span 12}
@media (max-width:1180px){ .s3{grid-column:span 6} .s4,.s5,.s7,.s8{grid-column:span 12} }
@media (max-width:640px){ .s3,.s6{grid-column:span 12} }
.kpi{background:var(--sheet); border-radius:22px; padding:18px 18px 0; overflow:hidden; display:flex; flex-direction:column; transition:transform .3s var(--ease), box-shadow .3s var(--ease)}
.kpi:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(14,59,46,.10)}
.kpi.lead{background:var(--palm); color:#fff}
.kpi span{color:var(--soft); font-size:.86rem} .kpi.lead span{color:#B9CFC4}
.kpi b{display:block; font-size:2rem; font-weight:500; letter-spacing:-.035em; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums}
.delta{display:inline-flex; align-items:center; gap:4px; font-size:.78rem; font-weight:500; border-radius:999px; padding:2px 9px; margin-top:6px; width:fit-content; background:var(--bg); color:var(--soft)}
.delta.up{background:#DDF3E5; color:#0F5E32} .delta.down{background:#FFD9D1; color:#8E1D0B}
.kpi.lead .delta{background:rgba(255,255,255,.12); color:#fff} .kpi.lead .delta.up{background:var(--citron); color:var(--text)}
.spark{display:block; width:calc(100% + 36px); margin:10px -18px 0; height:46px}
.panel{background:var(--sheet); border-radius:22px; padding:18px}
.panel h2{font-size:1rem; font-weight:600; display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px}
.panel h2 small{font-weight:400; color:var(--soft); font-size:.82rem}
.chart{display:block; width:100%; height:auto; overflow:visible}
.chart text{font-family:var(--font); font-size:11px; fill:var(--soft)}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .line{fill:none; stroke:var(--palm); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.1s var(--ease) .1s forwards}
.chart .area{animation:fade .9s ease .35s both}
.chart .pt .guide,.chart .pt circle{opacity:0; transition:opacity .15s}
.chart .pt:hover .guide,.chart .pt:hover circle{opacity:1}
.chart .hit{fill:transparent}
.chart .col{fill:var(--palm); transform-box:fill-box; transform-origin:bottom; animation:grow .7s var(--ease) both; transition:fill .2s}
.chart .col:hover{fill:var(--tomato)}
.chart .col.peak{fill:var(--tomato)}
.chart .seg{fill:none; stroke-width:20; transition:stroke-width .2s; animation:fade .8s ease both}
.chart .seg:hover{stroke-width:25}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{from{opacity:0}} @keyframes grow{from{transform:scaleY(0)}}
.donut{display:grid; grid-template-columns:150px 1fr; gap:18px; align-items:center}
.legend li{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:.9rem}
.legend i{width:10px; height:10px; border-radius:3px; flex:none}
.legend b{margin-inline-start:auto; font-weight:500; font-variant-numeric:tabular-nums}
.hbar{margin-top:12px} .hbar:first-of-type{margin-top:0}
.hbar .row{justify-content:space-between; flex-wrap:nowrap; font-size:.92rem}
.hbar .row span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hbar .meter{margin-top:5px} .hbar .meter i{animation:growx .8s var(--ease) both; transform-origin:left}
@keyframes growx{from{transform:scaleX(0)}}
.funnel{display:grid; gap:8px}
.funnel div{background:var(--palm); color:#fff; border-radius:12px; padding:10px 14px; display:flex; justify-content:space-between; min-width:fit-content; animation:growx .8s var(--ease) both; transform-origin:left}
.funnel div:nth-child(2){background:var(--palm-2)} .funnel div:nth-child(3){background:var(--citron); color:var(--text)}
.feed li{display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed li > div{flex:1; min-width:0}
.feed .small{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dotc{width:10px; height:10px; border-radius:50%; flex:none}
#tip{position:fixed; z-index:80; pointer-events:none; background:var(--text); color:#fff; border-radius:10px; padding:7px 11px; font-size:.82rem; white-space:nowrap; transform:translate(-50%,-135%); opacity:0; transition:opacity .12s}
#tip.on{opacity:1}
.skel{border-radius:22px; background:linear-gradient(90deg,#E9EEE4 25%,#F4F7F0 37%,#E9EEE4 63%); background-size:400% 100%; animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0} to{background-position:0 0}}
#view.still *{animation:none !important}

/* kitchen display */
#view:fullscreen{background:var(--bg); padding:24px}
.kds{display:grid; gap:14px; grid-template-columns:repeat(3,minmax(240px,1fr)); align-items:start}
.lane h2{font-size:1rem; font-weight:600; display:flex; justify-content:space-between; margin-bottom:10px}
.ticket{background:var(--sheet); border-radius:20px; padding:14px; margin-bottom:12px; border-inline-start:6px solid var(--line); animation:rise .4s var(--ease)}
.ticket.received{border-color:var(--tomato)} .ticket.preparing{border-color:#E3A400} .ticket.ready{border-color:var(--ok)}
.ticket.late{box-shadow:0 0 0 2px var(--bad)}
.ticket header{display:flex; justify-content:space-between; align-items:baseline}
.ticket h3{font-size:1.5rem; font-weight:500; letter-spacing:-.03em}
.age{font-variant-numeric:tabular-nums; font-weight:500}
.late .age{color:var(--bad)}
.ticket li{padding:5px 0; font-size:1.02rem}
.ticket li small{display:block; background:var(--citron); border-radius:8px; padding:2px 8px; font-size:.86rem; margin-top:3px; width:fit-content}
.ticket .btn{width:100%; margin-top:10px; padding:12px}

/* side sheet for forms and details */
.scrim{position:fixed; inset:0; background:rgba(7,30,23,.5); z-index:50; display:flex; justify-content:flex-end}
.sheet{width:min(520px,100%); height:100%; background:var(--bg); padding:22px; overflow-y:auto; animation:slide .35s var(--ease)}
@keyframes slide{from{transform:translateX(40px); opacity:0}}
.sheet header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.sheet h2{font-size:1.4rem; font-weight:500; letter-spacing:-.02em}
.sheetmsg{color:var(--bad); font-weight:500; min-height:1.4em; margin-top:10px}
.lines .row{margin-top:8px; flex-wrap:nowrap}
.lines select{flex:2} .lines input{flex:1; min-width:0}
.receipt{background:#fff; border-radius:16px; padding:20px; font-size:.92rem}
.receipt h3{font-size:1.1rem; font-weight:600}
.receipt table td{padding:5px 0; border:0} .receipt .tot td{border-top:1px solid var(--text); font-weight:600}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed; inset-block:0; inset-inline-start:0; width:260px; z-index:40; transform:translateX(-105%); transition:transform .35s var(--ease)}
  .side.show{transform:none; box-shadow:0 0 0 100vmax rgba(7,30,23,.5)}
  .menubtn{display:block} .bar{padding:14px 14px 8px; flex-wrap:wrap} .bar h1{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis} #branch{order:3; width:100% !important} #view{padding:6px 14px 40px} .msg{margin:0 14px}
  .kds{grid-template-columns:1fr}
}

/* ================= Bento UI: one grid, uniform gaps and corners, each block does one job ================= */
:root{ --r:26px; --gap:14px; --canvas:#E7EDE1 }
body{background:var(--canvas)}
.login{background:var(--canvas)}
.loginbento{display:grid; grid-template-columns:1.1fr 1fr; gap:var(--gap); width:100%; max-width:800px}
.lb-brand{position:relative; overflow:hidden; background:var(--palm); color:#fff; border-radius:var(--r); padding:28px; min-height:360px; display:flex; flex-direction:column}
.lb-brand::after{content:""; position:absolute; right:-10px; bottom:-10px; width:260px; height:260px; pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 100%, transparent 0 24px, rgba(215,242,90,.2) 24px 25.5px);
  -webkit-mask:radial-gradient(circle at 100% 100%, #000 30%, transparent 72%); mask:radial-gradient(circle at 100% 100%, #000 30%, transparent 72%)}
.lb-brand h1{font-size:clamp(2rem,5vw,2.7rem); font-weight:400; letter-spacing:-.035em; line-height:1.05; margin-top:auto}
.lb-brand p{color:#C9DDD2; margin:10px 0 18px; max-width:24ch}
.lb-brand .by{color:#B9CFC4} .lb-brand .by img{background:#fff; border-radius:7px; padding:4px 7px; height:28px}
.lb-form{background:var(--sheet); border-radius:var(--r); padding:28px; display:flex; flex-direction:column; justify-content:center}
.lb-form label:first-child{margin-top:0}
.shell{grid-template-columns:258px minmax(0,1fr); gap:var(--gap); padding:var(--gap)}
.side{border-radius:var(--r)}
.navlink{transition:background .25s, color .25s, transform .25s var(--ease)}
.navlink:not([aria-current]):hover{transform:translateX(3px)}
.bar{background:var(--sheet); border-radius:var(--r); padding:14px 20px; margin-bottom:var(--gap)}
.msg{margin:0} .msg:not(:empty){border-radius:18px; margin-bottom:var(--gap)}
#view{padding:0 0 30px; border-radius:var(--r)}
.card,.panel,.kpi,.tile,.ticket,.skel{border-radius:var(--r)}
.dash,.tiles,.grid2,.kds{gap:var(--gap)}
.card,.tiles{margin-bottom:var(--gap)}
.tools{background:var(--sheet); border-radius:var(--r); padding:10px 14px; margin:0 0 var(--gap)}
.tabs{background:var(--canvas); border:0}
.btn.ghost{border:0; background:var(--canvas)}
.btn:hover{filter:brightness(1.07)}
.tile{padding:18px; transition:transform .3s var(--ease)}
.panel{transition:transform .3s var(--ease)}
.tile:hover,.panel:hover{transform:translateY(-2px)}
.tiles .tile:first-child{background:var(--palm); color:#fff} .tiles .tile:first-child span{color:#B9CFC4}
.tiles .tile:nth-child(3){background:var(--citron)} .tiles .tile:nth-child(3) span{color:#4B5A1E}
.kpi:nth-child(3){background:var(--citron)} .kpi:nth-child(3) span{color:#4B5A1E} .kpi:nth-child(3) .delta:not(.up):not(.down){background:rgba(255,255,255,.55); color:var(--text)}
tr.click:hover td{background:#F3F7EE}
.ticket{transition:transform .25s var(--ease)} .ticket:hover{transform:translateY(-2px)}
.sheet{background:var(--canvas)}
.sheet input,.sheet select,.sheet textarea{border-color:transparent}
.receipt{border-radius:20px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr); padding:8px; gap:8px}
  .side{border-radius:0 var(--r) var(--r) 0}
  .bar{padding:12px 14px} #view{padding:0 0 30px}
  .loginbento{grid-template-columns:1fr} .lb-brand{min-height:230px}
}
/* fixed frame, logo, plate */
.shell{position:fixed; inset:0; height:auto; grid-template-rows:minmax(0,1fr); overflow:hidden}
.main{min-height:0; height:auto}
.side{min-height:0; gap:2px; padding:18px 12px 14px}
.side{align-self:start; max-height:100%}
.side nav{flex:0 1 auto; min-height:0; overflow-y:auto; margin:8px -4px 0; padding:0 4px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.25) transparent}
.side small{padding:12px 10px 3px}
.navlink{padding:8px 10px}
.who{margin-top:10px; padding-top:12px; flex:none}
.logo{width:34px; height:30px; flex:none; display:block}
.lb-brand,.side{--logo-v:#fff}
.name .wv{color:#fff} .name .wb{color:var(--tomato)}
.plate{display:inline-block; background:var(--text); color:#fff; border-radius:7px; padding:2px 9px; font-weight:600; letter-spacing:.06em; font-size:.86rem; white-space:nowrap}
.ticket .plate{margin:6px 0 2px; font-size:1rem; padding:3px 11px}
@media (max-width:900px){ .side{position:fixed; height:auto; max-height:none} .side nav{flex:1 1 auto} }
@media print{ body *{visibility:hidden} .receipt,.receipt *{visibility:visible} .receipt{position:absolute; inset:0 auto auto 0; width:80mm; border-radius:0} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="vb-logo" viewBox="0 0 128 112">
  <defs>
    <clipPath id="vb-top"><rect x="0" y="12" width="128" height="100"/></clipPath>
    <mask id="vb-cut">
      <rect width="128" height="112" fill="#fff"/>
      <g clip-path="url(#vb-top)"><path d="M6 -8 L41 90 L76 -8" fill="none" stroke="#000" stroke-width="33" stroke-linejoin="round"/></g>
      <circle cx="110" cy="15" r="15"/><circle cx="93" cy="8" r="9"/><circle cx="123" cy="33" r="9"/>
    </mask>
  </defs>
  <rect x="48" y="12" width="72" height="88" rx="27" fill="#F0462B" mask="url(#vb-cut)"/>
  <g fill="#fff"><rect x="82" y="50" width="5.5" height="16" rx="2.75"/><rect x="91.5" y="42" width="5.5" height="32" rx="2.75"/><rect x="101" y="47" width="5.5" height="22" rx="2.75"/><rect x="110.5" y="53" width="5.5" height="10" rx="2.75"/></g>
  <g clip-path="url(#vb-top)"><path d="M6 -8 L41 90 L76 -8" fill="none" style="stroke:var(--logo-v,#0E3B2E)" stroke-width="23" stroke-linejoin="round"/></g>
</symbol></svg>

<section class="login" id="login">

<script>
/* ================= core ================= */
const params = new URLSearchParams(location.search);
const API = (params.get("api") || "https://devx-ai-voice-commerce.onrender.com") + "/admin/api";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const num = x => Number(x || 0);
const UNITS = ["kg", "g", "litre", "ml", "piece", "pack", "tray", "crate"];
const ROLE_NAMES = { platform_admin: "Platform admin", merchant_admin: "Merchant admin", store_manager: "Store manager", cashier: "Cashier or window", kitchen: "Kitchen", inventory: "Inventory and purchasing", analyst: "Read-only analyst" };
const NAV = [
  ["Operations", [["today", "Dashboard", "orders.view"], ["kitchen", "Kitchen display", "orders.view"], ["orders", "Orders", "orders.view"]]],
  ["Catalogue", [["menu", "Menu", "orders.view"]]],
  ["Stock", [["inventory", "Inventory", "inventory.view"], ["recipes", "Recipes", "inventory.view"], ["waste", "Waste", "inventory.view"], ["purchasing", "Purchasing", "inventory.view"], ["assets", "Assets", "inventory.view"]]],
  ["Customers", [["customers", "Customers", "crm.view"], ["offers", "Offers and campaigns", "crm.view"]]],
  ["Insights", [["reports", "Reports", "analytics.view"]]],
  ["Admin", [["team", "Team", "team.manage"], ["settings", "Settings", "settings.manage"], ["audit", "Audit log", "audit.view"], ["launch", "Launch check", "settings.manage"]]]
];
const TITLES = Object.fromEntries(NAV.flatMap(g => g[1].map(p => [p[0], p[1]])));

let token = null, me = null, page = "today", timers = [], S = {};   // S holds whatever the current page loaded
try { token = sessionStorage.getItem("consoleToken"); } catch (e) {}
const RENDER = {}, ACT = {};

async function api(path, method = "GET", body) {
  let r;
  try { r = await fetch(API + path, { method, body: body ? JSON.stringify(body) : undefined,
    headers: Object.assign({ "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {}) }); }
  catch (e) { throw new Error("Can't reach the server. It may be waking up; try again in 30 seconds."); }
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/login") { signOut(); throw new Error("Your session ended. Sign in again."); }
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Check the values you entered (" + r.status + ").");
  return data;
}
const can = c => !!me && me.caps.includes(c);
const records = async name => (await api("/data/" + name)).records;
const cur = () => (me && me.business.currency) || "AED";
const money = f => cur() + " " + (num(f) / 100).toFixed(2);
const ts = v => { const s = String(v || ""); return Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z"); };
const when = v => { const d = new Date(ts(v)); return isNaN(d) ? String(v || "") : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); };
const span = s => { s = Math.max(0, Math.round(num(s))); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const bq = extra => { const b = $("branch").hidden ? "" : $("branch").value; const q = [b && b !== "all" ? "location=" + b : "", extra || ""].filter(Boolean).join("&"); return q ? "?" + q : ""; };
const branchName = id => ((me.locations.find(l => l.locationId === id) || {}).name) || id || "";
function say(text, bad) { $("msg").textContent = text || ""; $("msg").classList.toggle("bad", !!bad); if (text && !bad) setTimeout(() => { if ($("msg").textContent === text) $("msg").textContent = ""; }, 4000); }
const attempt = async (fn, done) => { try { await fn(); if (done) say(done); } catch (e) { say(e.message, true); } };
const pill = (text, tone) => `<span class="pill ${tone || ""}">${esc(text)}</span>`;
const tile = (value, label) => `<div class="tile"><b>${value}</b><span>${esc(label)}</span></div>`;
function table(cols, rows, empty, rowAttr) {
  if (!rows.length) return `<div class="card"><p class="empty">${esc(empty)}</p></div>`;
  return `<div class="card flush scroll"><table><tr>${cols.map(c => `<th class="${c.cls || ""}">${esc(c.label)}</th>`).join("")}</tr>
    ${rows.map(r => `<tr ${rowAttr ? rowAttr(r) : ""}>${cols.map(c => `<td class="${c.cls || ""}">${c.cell(r)}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function download(name, rows) {
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = name; a.click();
}

/* ================= side sheet and forms ================= */
function openSheet(title, html) { $("sheet").innerHTML = `<header><h2>${esc(title)}</h2><button class="btn ghost sm" data-act="closeSheet">Close</button></header>${html}`; $("scrim").hidden = false; const f = $("sheet").querySelector("input,select,textarea"); if (f) f.focus(); }
function closeSheet() { $("scrim").hidden = true; $("sheet").innerHTML = ""; }
ACT.closeSheet = closeSheet;
$("scrim").addEventListener("mousedown", e => { if (e.target === $("scrim")) closeSheet(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeSheet(); });
function fieldHtml(f, v) {

function segment(c) { const days = (Date.now() - c.last) / 864e5; if (!c.orders) return "No orders"; if (days > 60) return "Inactive"; if (days > 30) return "Lapsing"; if (c.orders >= 5 && days <= 14) return "Champion"; if (c.orders >= 3) return "Frequent"; return "New"; }

    c.orders++; c.spend += num(x.total); c.last = Math.max(c.last, ts(x.createdAt)); (x.items || []).forEach(i => c.items[i.name] = (c.items[i.name] || 0) + (i.quantity || 1)); });

  const count = s => S.cust.filter(c => c.seg === s).length, tone = { Champion: "hi", Frequent: "ok", New: "", Lapsing: "warn", Inactive: "bad" };
  return `<div class="tools"><span class="soft small grow">Customers are added when staff link a phone number to an order, with the customer's consent recorded.</span><button class="btn ghost sm" data-act="custCsv">Export CSV</button></div>
    <div class="tiles">${["Champion", "Frequent", "New", "Lapsing", "Inactive"].map(s => tile(count(s), s)).join("")}</div>` +
    table([{ label: "Customer", cell: c => `<b style="font-weight:500">${esc(c.name || "No name")}</b><br><span class="soft small">${esc(c.phone || c.id)}</span>` }, { label: "Segment", cell: c => pill(c.seg, tone[c.seg]) }, { label: "Orders", cls: "r", cell: c => c.orders },
      { label: "Spend", cls: "r", cell: c => money(c.spend) }, { label: "Average", cls: "r", cell: c => c.orders ? money(c.spend / c.orders) : "" }, { label: "Last order", cell: c => c.last ? esc(when(new Date(c.last).toISOString())) : "" },
      { label: "Usual", cell: c => esc(c.usual) }, { label: "Offers", cell: c => c.marketingConsent ? pill("Consented", "ok") : pill("No consent") }], S.cust, "No customers yet. Open an order and link the customer's phone number to start building profiles.");
};
ACT.custCsv = () => download("customers.csv", [["Name", "Phone", "Segment", "Orders", "Spend", "Last order", "Marketing consent"], ...S.cust.map(c => [c.name, c.phone || c.id, c.seg, c.orders, (c.spend / 100).toFixed(2), c.last ? new Date(c.last).toISOString() : "", c.marketingConsent ? "yes" : "no"])]);
const COUPON_FIELDS = [{ key: "code", label: "Code", req: true, placeholder: "KARAK10" }, { key: "kind", label: "Discount type", type: "select", options: [["percent", "Percent off"], ["amount", "Amount off"]] }, { key: "value", label: "Value (percent, or amount in currency)", type: "number", req: true },
  { key: "validFrom", label: "Valid from", placeholder: "2026-10-01" }, { key: "validTo", label: "Valid to", placeholder: "2026-12-31" }, { key: "usageLimit", label: "Usage limit, 0 for none", type: "number", def: 0 }, { key: "branchId", label: "Branch", type: "select", options: [] }, { key: "active", label: "Active", type: "checkbox", def: true }];
const CAMP_FIELDS = [{ key: "name", label: "Campaign name", req: true }, { key: "segment", label: "Send to segment", type: "select", options: ["Champion", "Frequent", "New", "Lapsing", "Inactive"] }, { key: "channel", label: "Channel", type: "select", options: ["WhatsApp", "Web Push"] },
  { key: "message", label: "Message", type: "textarea", req: true }, { key: "coupon", label: "Coupon code to include" }];
RENDER.offers = async () => { const [co, ca] = await Promise.all([records("coupons"), records("campaigns")]); S.coupons = co; S.camps = ca; const edit = can("crm.edit"); COUPON_FIELDS[6].options = [["all", "All branches"], ...me.locations.map(l => [l.locationId, l.name])];
  return `<div class="tools"><h2 class="grow" style="font-size:1.05rem; font-weight:600">Coupons</h2>${edit ? `<button class="btn" data-act="couponNew">Add coupon</button>` : ""}</div>` +
    table([{ label: "Code", cell: c => `<b style="font-weight:500">${esc(c.code)}</b>` }, { label: "Discount", cell: c => c.kind === "percent" ? num(c.value) + "% off" : cur() + " " + num(c.value).toFixed(2) + " off" }, { label: "Valid", cell: c => esc([c.validFrom, c.validTo].filter(Boolean).join(" to ")) },
      { label: "Limit", cls: "r", cell: c => num(c.usageLimit) || "None" }, { label: "Branch", cell: c => esc(c.branchId === "all" || !c.branchId ? "All" : branchName(c.branchId)) }, { label: "Status", cell: c => c.active ? pill("Active", "ok") : pill("Off") },
      { label: "", cls: "a", cell: c => edit ? `<button class="btn ghost sm" data-act="couponEdit" data-id="${esc(c.id)}">Edit</button>` : "" }], co, "No coupons yet.") +
    `<div class="tools" style="margin-top:8px"><h2 class="grow" style="font-size:1.05rem; font-weight:600">Campaigns</h2>${edit ? `<button class="btn" data-act="campNew">Draft campaign</button>` : ""}</div>
    <p class="soft small" style="margin:-6px 0 12px">Campaigns are saved as drafts. Sending needs a WhatsApp Business account and Web Push keys, which are not connected yet.</p>` +
    table([{ label: "Campaign", cell: c => `<b style="font-weight:500">${esc(c.name)}</b><br><span class="soft small">${esc(c.message)}</span>` }, { label: "Segment", cell: c => esc(c.segment) }, { label: "Channel", cell: c => esc(c.channel) }, { label: "Coupon", cell: c => esc(c.coupon || "") }, { label: "Status", cell: () => pill("Draft", "warn") },
      { label: "", cls: "a", cell: c => edit ? `<button class="btn ghost sm" data-act="campEdit" data-id="${esc(c.id)}">Edit</button>` : "" }], ca, "No campaigns drafted yet."); };
ACT.couponNew = () => form("Add coupon", COUPON_FIELDS, {}, v => api("/data/coupons/" + slug(v.code), "PUT", { ...v, code: v.code.toUpperCase() }));
ACT.couponEdit = d => { const c = S.coupons.find(x => x.id === d.id); form("Edit " + c.code, COUPON_FIELDS, c, v => api("/data/coupons/" + d.id, "PUT", { ...v, code: v.code.toUpperCase() }), { onDelete: () => api("/data/coupons/" + d.id, "DELETE") }); };
ACT.campNew = () => form("Draft campaign", CAMP_FIELDS, {}, v => api("/data/campaigns/" + slug(v.name), "PUT", { ...v, status: "draft" }));
ACT.campEdit = d => { const c = S.camps.find(x => x.id === d.id); form("Edit " + c.name, CAMP_FIELDS, c, v => api("/data/campaigns/" + d.id, "PUT", { ...v, status: "draft" }), { onDelete: () => api("/data/campaigns/" + d.id, "DELETE") }); };

/* ================= reports ================= */
RENDER.reports = async () => {
  const tab = S.repTab || "sales", days = S.repDays || 14;
  const head = `<div class="tools"><div class="tabs">${[["sales", "Sales"], ["voice", "Voice"], ["stock", "Stock and waste"]].map(([k, l]) => `<button data-act="repTab" data-t="${k}" aria-pressed="${k === tab}">${l}</button>`).join("")}</div><span class="grow"></span>
    <select data-change="repDays" style="width:auto" aria-label="Period">${[7, 14, 30].map(d => `<option value="${d}" ${d === days ? "selected" : ""}>Last ${d} days</option>`).join("")}</select></div>`;
  if (tab === "sales") { const d = await api("/dashboard" + bq("days=" + days));
    return head + `<div class="tiles">${tile(d.orders, "Orders")}${tile(money(d.revenue), "Sales")}${tile(money(d.averageOrder), "Average order")}${tile(money(d.refunded), "Refunded")}${tile(d.averagePrepSeconds ? span(d.averagePrepSeconds) : "No data", "Average time to ready")}</div>
      <div class="panel" style="margin-bottom:16px"><h2>Sales per day<small>Days are counted in UTC. Cancelled orders are left out.</small></h2>${areaChart(d.days.map(x => ({ label: x.date.slice(5), value: x.revenue, tip: x.date + ": " + money(x.revenue) + " from " + x.orders + " orders" })), money, v => (v / 100 >= 1000 ? (v / 100000).toFixed(1) + "k" : Math.round(v / 100)))}</div>
      <div class="grid2"><div>${table([{ label: "Best sellers", cell: i => esc(i.name) }, { label: "Sold", cls: "r", cell: i => i.quantity }, { label: "Sales", cls: "r", cell: i => money(i.revenue) }], d.topItems, "No orders in this period.")}</div>
        <div>${table([{ label: "Payment", cell: e => esc(e[0] === "unpaid" ? "Not yet paid" : e[0]) }, { label: "Value", cls: "r", cell: e => money(e[1]) }], Object.entries(d.byPayment), "No payments in this period.")}</div></div>`; }
  if (tab === "voice") { const d = await api("/insights" + bq("days=" + days)), u = d.usage;
    return head + `<div class="tiles">${tile(d.calls, "Voice calls")}${tile(d.conversion + "%", "Ended with an order")}${tile(d.abandoned, "Abandoned with items")}${tile(d.failed, "Ended with an error")}${tile(span(d.averageSeconds), "Average call")}</div>
      <div class="tiles">${tile(u.minutes, "Minutes on calls")}${tile(u.inputTokens.toLocaleString(), "Input tokens")}${tile(u.outputTokens.toLocaleString(), "Output tokens")}${u.ratesSet ? tile(cur() + " " + u.estimatedCost.toFixed(2), "Estimated voice cost") : ""}</div>
      ${u.ratesSet ? "" : `<p class="soft small" style="margin:-6px 0 14px">Enter your voice model rates under Settings to see estimated cost.</p>`}
      <div class="grid2"><div>${table([{ label: "Asked about but not ordered", cell: i => esc(i.name) }, { label: "Calls", cls: "r", cell: i => i.calls }], d.notOrdered, "Nothing yet.")}</div>
      <div>${table([{ label: "Recent calls", cell: c => esc(when(c.startedAt)) }, { label: "Length", cls: "r", cell: c => span(c.durationSec) }, { label: "Outcome", cell: c => c.orderPlaced ? "Order " + esc(c.orderId) : c.error ? pill("Error", "bad") : "No order" }], d.recent, "No calls recorded in this period.")}</div></div>
      <p class="soft small">Recognition confidence and human takeover are not measured yet; the voice model does not report them.</p>`; }
  const [ing, waste, moves] = await Promise.all([records("ingredients"), records("waste"), records("stock_moves")]); const since = Date.now() - days * 864e5, w = waste.filter(x => ts(x.at) >= since), used = {};
  moves.filter(m => m.type === "consumption" && ts(m.at) >= since).forEach(m => used[m.ingredientId] = (used[m.ingredientId] || 0) - num(m.qty));
  return head + `<div class="tiles">${tile(money(ing.reduce((s, i) => s + num(i.onHand) * num(i.unitCost), 0)), "Stock value")}${tile(ing.filter(i => num(i.reorderPoint) > 0 && num(i.onHand) <= num(i.reorderPoint)).length, "Low-stock items")}${tile(money(w.reduce((s, x) => s + num(x.cost), 0)), "Waste cost in period")}${tile(w.length, "Waste entries in period")}</div>` +
    table([{ label: "Consumption from completed orders", cell: i => esc(i.name) }, { label: "Used", cls: "r", cell: i => +num(used[i.id]).toFixed(2) + " " + esc(i.unit) }, { label: "Cost", cls: "r", cell: i => money(num(used[i.id]) * num(i.unitCost)) }, { label: "On hand", cls: "r", cell: i => num(i.onHand) + " " + esc(i.unit) }], ing.filter(i => used[i.id]), "No recipe-based consumption in this period. Complete an order whose items have recipes.");
};
ACT.repTab = d => { S.repTab = d.t; show("reports"); }; ACT.repDays = (d, el) => { S.repDays = Number(el.value); show("reports"); };

/* ================= team ================= */
RENDER.team = async () => { S.staff = (await api("/staff")).staff;
  return `<div class="tools"><span class="soft small grow">Each person signs in with their own username and password or PIN. The built-in admin account is a merchant admin.</span><button class="btn" data-act="staffNew">Add person</button></div>` +
    table([{ label: "Username", cell: s => `<b style="font-weight:500">${esc(s.username)}</b>` }, { label: "Role", cell: s => esc(ROLE_NAMES[s.role] || s.role) }, { label: "Branch", cell: s => esc(s.location === "all" ? "All branches" : branchName(s.location)) },
      { label: "", cls: "a", cell: s => `<button class="btn ghost sm" data-act="staffEdit" data-id="${esc(s.username)}">Edit</button>` }], S.staff, "No team members yet. Add your kitchen, window and stock staff.") +
    `<div class="card"><h2>What each role can do</h2><p class="soft small">Merchant admin: everything. Store manager: everything except team and settings, including refunds and purchase approval. Cashier or window: orders, payment, waste. Kitchen: kitchen display, order status, waste, stock view. Inventory and purchasing: stock, recipes, waste, assets, purchase orders. Read-only analyst: view only.</p></div>`; };
const staffFields = isNew => [{ key: "username", label: "Username", req: true, readonly: !isNew }, { key: "role", label: "Role", type: "select", options: me.roles.filter(r => r !== "platform_admin" || me.role === "platform_admin").map(r => [r, ROLE_NAMES[r] || r]) },
  { key: "location", label: "Branch", type: "select", options: [["all", "All branches"], ...me.locations.map(l => [l.locationId, l.name])] }, { key: "password", label: isNew ? "Password or PIN (6 or more characters)" : "New password or PIN (leave empty to keep)", type: "password", req: isNew }];
const staffSave = v => api("/staff/" + slug(v.username), "PUT", Object.assign({ role: v.role, location: v.location }, v.password ? { password: v.password } : {}));
ACT.staffNew = () => form("Add person", staffFields(true), { role: "cashier" }, staffSave);
ACT.staffEdit = d => { const s = S.staff.find(x => x.username === d.id); form("Edit " + s.username, staffFields(false), s, staffSave, { onDelete: () => api("/staff/" + d.id, "DELETE") }); };

/* ================= settings ================= */
const SET_BUSINESS = [{ key: "legalName", label: "Legal business name" }, { key: "trn", label: "Tax registration number (TRN)", hint: "15 digits. Shown on tax invoices." }, { key: "address", label: "Address", type: "textarea" }, { key: "currency", label: "Currency" },
  { key: "vatRate", label: "VAT rate %", type: "number" }, { key: "pricesIncludeVat", label: "Menu prices include VAT", type: "checkbox" }, { key: "prepSlaMinutes", label: "Preparation target in minutes", type: "number", hint: "Orders older than this are flagged on the kitchen display." }];
const SET_VOICE = [{ key: "greeting", label: "Greeting", req: true }, { key: "voice", label: "Voice", type: "select", options: [] }, { key: "upsell", label: "Upsell rule", type: "textarea" }, { key: "hoursEnabled", label: "Only take orders during opening hours", type: "checkbox" },
  { key: "openTime", label: "Opens", type: "time" }, { key: "closeTime", label: "Closes", type: "time" }, { key: "utcOffset", label: "Time zone offset", hint: "UAE is +04:00" }, { key: "closedMessage", label: "Message when closed", req: true },
  { key: "accessCode", label: "Access code for the ordering app", hint: "Leave empty for open access." }, { key: "costPer1kInput", label: "Voice input rate per 1,000 tokens", type: "number" }, { key: "costPer1kOutput", label: "Voice output rate per 1,000 tokens", type: "number" }];
RENDER.settings = async () => { S.set = await api("/settings"); SET_VOICE[1].options = me.voices; const site = location.origin + location.pathname.replace(/console\.html$/, "");
  const line = (fields) => fields.map(f => `<div class="alert"><div class="soft">${esc(f.label)}</div><b style="font-weight:500; text-align:end">${f.type === "checkbox" ? (S.set[f.key] ? "Yes" : "No") : esc(S.set[f.key] === "" || S.set[f.key] == null ? "Not set" : S.set[f.key])}</b></div>`).join("");
  return `<div class="grid2"><div class="card"><div class="row"><h2 class="grow" style="margin:0">Business and tax</h2><button class="btn ghost sm" data-act="setEdit" data-g="business">Edit</button></div>${line(SET_BUSINESS)}</div>
    <div class="card"><div class="row"><h2 class="grow" style="margin:0">Voice attendant</h2><button class="btn ghost sm" data-act="setEdit" data-g="voice">Edit</button></div>${line(SET_VOICE)}</div></div>
    <div class="tools"><h2 class="grow" style="font-size:1.05rem; font-weight:600">Branches</h2><button class="btn" data-act="branchNew">Add branch</button></div>` +
    table([{ label: "Branch", cell: l => `<b style="font-weight:500">${esc(l.name)}</b>` }, { label: "Ordering link for QR codes and signage", cell: l => `<a href="${esc(site)}?location=${esc(l.locationId)}" target="_blank" rel="noopener">${esc(site)}?location=${esc(l.locationId)}</a>` },
      { label: "", cls: "a", cell: l => `<button class="btn ghost sm" data-act="branchEdit" data-id="${esc(l.locationId)}">Rename</button>` }], me.locations, "") +
    `<p class="soft small">VAT and receipt settings should be checked with your tax advisor before going live.</p>`; };
const setSave = async v => { const all = { ...S.set, ...v }; ["costPer1kInput", "costPer1kOutput", "vatRate"].forEach(k => all[k] = parseFloat(all[k]) || 0); all.prepSlaMinutes = Math.round(num(all.prepSlaMinutes)) || 8; await api("/settings", "PUT", all); me = await api("/me"); };
ACT.setEdit = d => form(d.g === "business" ? "Business and tax" : "Voice attendant", d.g === "business" ? SET_BUSINESS : SET_VOICE, S.set, setSave);
const branchDone = r => { me.locations = r.locations; };
ACT.branchNew = () => form("Add branch", [{ key: "name", label: "Branch name", req: true }], {}, async v => branchDone(await api("/locations/" + slug(v.name), "PUT", v)));
ACT.branchEdit = d => form("Rename branch", [{ key: "name", label: "Branch name", req: true }], me.locations.find(l => l.locationId === d.id), async v => branchDone(await api("/locations/" + d.id, "PUT", v)), d.id === "main" ? {} : { onDelete: async () => branchDone(await api("/locations/" + d.id, "DELETE")) });

/* ================= audit and launch check ================= */
RENDER.audit = async () => table([{ label: "When", cell: e => esc(when(e.at)) }, { label: "Who", cell: e => `${esc(e.user)} <span class="soft small">${esc(ROLE_NAMES[e.role] || e.role)}</span>` }, { label: "Action", cell: e => esc(String(e.action).replace(/_/g, " ")) },
  { label: "Target", cell: e => esc(e.target) }, { label: "Detail", cell: e => `<span class="small">${esc(e.detail)}</span>` }], await records("audit"), "No activity recorded yet.");
RENDER.launch = async () => { const [set, m, ing, rec, staff, o] = await Promise.all([api("/settings"), menuData(), records("ingredients"), records("recipes"), api("/staff"), api("/orders")]); const withRecipe = m.items.filter(i => rec.some(r => r.id === i.itemId && (r.lines || []).length)).length;
  const checks = [["Business name and TRN entered", !!(set.legalName && set.trn), "settings", "Needed for VAT receipts."], ["Menu has items", m.items.length > 0, "menu", m.items.length + " items in " + m.categories.length + " categories."],
    ["Ingredients added", ing.length > 0, "inventory", ing.length + " stock items."], ["Every menu item has a recipe", m.items.length > 0 && withRecipe === m.items.length, "recipes", withRecipe + " of " + m.items.length + " items have one."],
    ["Kitchen and window staff added", staff.staff.some(s => s.role === "kitchen") && staff.staff.some(s => s.role === "cashier"), "team", "At least one kitchen and one cashier account."],
    ["A test order has been completed", o.orders.some(x => x.status === "completed"), "kitchen", "Place a voice order and take it through the kitchen display."],
    ["Online payment gateway connected", false, "", "Not available yet. Orders are paid at the window."], ["WhatsApp and Web Push connected", false, "", "Not available yet. Campaigns stay as drafts."], ["Arabic voice ordering", false, "", "Not available yet. The current voice model does not support Arabic."]];
  const done = checks.filter(c => c[1]).length;
  return `<div class="card"><h2>${done} of ${checks.length} ready</h2><div class="meter" style="margin-bottom:6px"><i style="width:${100 * done / checks.length}%"></i></div>
    ${checks.map(c => `<div class="alert">${c[1] ? pill("Ready", "ok") : pill(c[2] ? "To do" : "Not available", c[2] ? "warn" : "")}<div><b style="font-weight:500">${esc(c[0])}</b><br><span class="soft small">${esc(c[3])}</span></div>${c[2] && !c[1] ? `<button class="btn ghost sm" data-goto="${c[2]}">Open</button>` : ""}</div>`).join("")}</div>`; };

start();
</script>
</body>
</html>
